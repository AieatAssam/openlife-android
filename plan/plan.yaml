1, remove_diacritics, bm25; SQLite 3.53.4. Host engine (python3 sqlite3 3.53.3 with FTS5, not SQLCipher) runs the real MIGRATION_4_5, triggers and query SQL: 500 spans / 50 hits: FTS5 16 ms (GREEN run), 43 ms (52ed89a run), 25 ms (final run); LIKE fallback 25 ms (final run); host only (R5 performance recorded on the host). Schema v5: 4.json->5.json differs only in version (identityHash unchanged; FTS tables are not entities); both 5.json copies byte-identical. Connected: none run (owner instruction: no emulator, no tablet, no adb). No CI run (not pushed). Review round W-01..W-06 (commit 'P2-08: address review findings W-01..W-06'): not compiled or run locally until CI reports (Gradle not run; another agent held the build slot). Host experiments (python3 -I, sqlite3 3.53.3, 2026-11-25): without FTS5 secure-delete a deleted term stays in <t>_data; with secure-delete=1 the bytes are absent after a cascade, a single-source delete and an update (other source kept as positive control); the option persists in <t>_config across close/reopen; an unknown option raises SQL logic error (pre-3.42 behaviour); recursive_triggers off still fires the FTS delete triggers on cascade; unicode61 keeps Ⅻ, x², ½ as tokens, MATCH misses 請求書 inside a CJK run while LIKE finds it and รับเงิน and पत्र; %Ärzte% finds Ärzte, %ärzte% does not; a failed create plus drop leaves no FTS object. Pinned libsqlcipher.so has no ENABLE_ICU and no SECURE_DELETE option. CI caveat: the JVM job runs ubuntu-22.04 with the distro python3, whose SQLite (believed 3.37.2, not checked on the runner) is below 3.42 and has no secure-delete, so about 12 of 15 SearchIndexHostTest cases skip there via SearchFixture.assumeIndexed and a green CI does not verify W-01; run ./gradlew :vault:test on this VM (SQLite 3.53.3) when the build slot is free, or move the JVM job to a 3.42+ host (e.g. ubuntu-24.04), a coordinator decision.", notes: "Branch plan/P2-08-local-search from plan/P2-07-assessment-state head 591f168 (on P1-19, PR #26); schema v5 assumes no other migration PR merges first, otherwise renumber (conventions.schema_migrations). Device gaps, each implemented; unverified (gap - pending physical-device run): FtsAvailabilityTest.sqlcipherBuildSupportsFts5 (./gradlew :vault:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.openlife.vault.storage.FtsAvailabilityTest); SearchRepositoryTest findsSpanTextAndCorrectionsRankedAndLinked, excludesRejectedStaleAndNonReadySources, deletingASourceRemovesItsHits, cascadeOnlyDeletionLeavesNoFtsRows, queryIsSanitisedAgainstFts5Syntax, roomValidatesAMigratedDatabaseWithTheFtsTablesPresent (./gradlew :vault:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.openlife.vault.search.SearchRepositoryTest); SearchScreenTest.resultOpensViewerWithSpanSelectedAndFieldClearsOnStop (./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.openlife.app.ui.search.SearchScreenTest); existing OcrDatabaseTest, SourceDatabaseTest and OpenLifeDatabaseReadyInvariantTest now open v5, not run (same command per class). The acceptance target (<200 ms for 500 spans on a device) is unverified; only the host figure exists. The same cases run on the JVM in SearchIndexHostTest against host SQLite. Design: FTS5 external-content tables ocr_text_fts(text) over ocr_spans and ocr_correction_fts(correctedText) over ocr_user_revisions, tokenizer unicode61 remove_diacritics 2, six AFTER INSERT/UPDATE/DELETE triggers, 'rebuild' in the migration; SearchIndex.create is shared by MIGRATION_4_5 and the fresh-database callback, followed by ReadyInvariantTriggers. Never VACUUM (rowid keying); a boundary test enforces it. SearchDao uses @RawQuery with observedEntities so results re-emit on change. Deviations: (1) results are wider-filtered than the brief: only the revision the viewer shows (latest by startedAt/rowid, READY, not REJECTED), spans whose latest review is REJECTED excluded, only