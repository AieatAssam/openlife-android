decisions_made_by_this_plan:
  # Calls the plan makes so no decision is left hanging. Each becomes an ADR
  # written by the named step; the ADR records the reasoning below verbatim
  # plus any environment facts discovered while implementing.
  - id: ADR-0003
    title: Replace ML Kit with an open-source, telemetry-free OCR engine before v0.2.0
    call: >
      Adopt tesseract4android (cz.adaptech.tesseract4android:tesseract4android-openmp,
      Apache-2.0) with the tessdata_fast `eng.traineddata` model vendored into
      vault/src/main/assets and pinned by SHA-256, behind the existing OcrEngine
      seam. ML Kit is removed once the evaluation gate in P2-04 passes.
      Fallback if the gate fails: RapidOCR ONNX models (Apache-2.0) via
      onnxruntime-android (MIT). Both are fully offline and open source.
    why: >
      P1 forbids any telemetry SDK; the bundled ML Kit artefact ships a
      datatransport/telemetry stack that is only inert because INTERNET is
      stripped. P6 requires auditable, open-source components; ML Kit is
      closed-source and its terms block F-Droid distribution. This reverses
      decision 0002's engine choice while keeping every C1 boundary it set.
    owner_visibility: "Reversal of an owner-approved engine choice; the ADR must be acknowledged by the owner before P2-05 removes ML Kit."
    written_by: P2-03
  - id: ADR-0004
    title: App lock is an optional BiometricPrompt gate, not authentication-bound keys, for v1.0
    call: >
      Add an opt-in app lock using androidx.biometric BiometricPrompt with
      BIOMETRIC_STRONG or DEVICE_CREDENTIAL, a configurable re-lock timeout
      (default: immediately on background), enforced on every content-bearing
      screen and on notification taps. Keystore keys stay non-auth-bound in
      v1.0. Copy states plainly that the lock is an access gate against an
      already-unlocked phone and does not add cryptographic protection.
    why: >
      Auth-bound keys risk permanent vault loss on credential changes and
      complicate reminder delivery paths (P7). A gate resolves the open
      design question in §3 without changing key lifecycle. Revisit
      auth-bound keys only with a tested key-migration path.
    written_by: P1-07
  - id: ADR-0005
    title: Vault-unavailable recovery UX and explicit Reset vault
    call: >
      Distinguish 'temporarily unavailable' (retry, reboot advice) from
      'unrecoverable' (wrapper cannot unwrap, key missing) in the UI. Provide
      Settings > Reset vault with a two-step confirmation that names the
      permanent-loss consequence and deletes all app-owned files and the
      Keystore alias. Reset is never offered as the primary error action.
    written_by: P1-06
  - id: ADR-0006
    title: UI foundation
    call: >
      Material 3 with light/dark themes and a FIXED OpenLife palette (dynamic
      colour OFF; amended 2026-09-16 by docs/design/VISUAL_IDENTITY.md so the
      app is recognisable rather than recoloured per device), edge-to-edge via
      enableEdgeToEdge with inset-aware scaffolds, predictive back with
      BackHandler, Navigation Compose with type-safe routes, all user-visible
      text in string resources, bundled OFL typefaces (IBM Plex Sans/Mono,
      Fraunces), the folded-corner keyhole mark as adaptive icon, Android 12+
      splash screen API. No third-party UI libraries.
    written_by: P0-07
  - id: ADR-0007
    title: Release engineering
    call: >
      JDK 21 everywhere (CI and docs). Gradle dependency verification
      (sha256 + pgp where available) enforced in CI. CycloneDX SBOM and a
      licence report produced per release. detekt with formatting rules as
      the single static-analysis tool. R8 minify + resource shrinking on
      release with explicit keep rules and a release-variant instrumented
      smoke run. Release signing from CI secrets; upload key generated by the
      owner via runbook. Distribution order: GitHub Releases (signed APK),
      then F-Droid (after ML Kit removal), Google Play optional after v1.0.
      Versioning: semver versionName; versionCode = major*10000 + minor*100 + patch.
      Play (optional, after v1.0) implies Play App Signing: a Play install shows Google's
      distribution certificate, so the About/README fingerprint copy states that the
      upload-key fingerprint applies to GitHub and F-Droid builds only.
    written_by: P0-02, P0-03, P0-04, P0-05, P0-06
  - id: ADR-0008
    title: Conservative interpretation rules for typed facts
    call: >
      Dates with two plausible day/month readings produce a CLARIFICATION_NEEDED
      fact with both candidates; the device locale is a display hint only.
      Date-only values are stored as ISO local dates, never instants. Times
      are stored as local times; a timezone is attached only when confirmed.
      Money is stored as a decimal string plus an ISO-4217 code that is null
      unless the source shows an unambiguous code or a symbol that maps to a
      single currency in the source's evidenced context. URLs, emails, and
      phone numbers are stored as text and rendered inert (no link, no copy).
    written_by: P3-01
  - id: ADR-0009
    title: Reminder scheduling mechanism
    call: >
      AlarmManager.setAndAllowWhileIdle windowed alarms by default; exact
      alarms only if the user grants SCHEDULE_EXACT_ALARM at the point of
      enabling 'exact' on a reminder. RECEIVE_BOOT_COMPLETED receiver
      reschedules from the database. TIMEZONE_CHANGED and TIME_SET trigger
      recomputation. POST_NOTIFICATIONS requested when the first reminder is
      enabled; denial leaves the event confirmed and visibly unscheduled.
      Notification content is generic and opens the detail screen behind the
      app lock. No WorkManager, no foreground service, no calendar writes.
    written_by: P4-01
  - id: ADR-0010
    title: Local text search
    call: >
      SQLite FTS5 external-content tables over OCR span text, corrections,
      fact values, and record titles, inside the SQLCipher database. If the
      pinned SQLCipher build lacks FTS5 (checked by a test), fall back to a
      trigram LIKE index. Search results always link to source and span.
    written_by: P2-08
  - id: ADR-0011
    title: PDF rendering (C9)
    call: >
      Platform android.graphics.pdf.PdfRenderer only; pages rendered to
      bounded bitmaps; text obtained by the OCR pipeline per page so evidence
      coordinates are page pixels on every supported API; 32 MiB and 50-page
      limits; no JavaScript, attachments, or external resource loading is
      possible because no PDF viewer engine is embedded.
    written_by: P7-02
  - id: ADR-0012
    title: Communication safety assessment (C10)
    call: >
      Rule-based indicator detection versioned in the repository (urgency
      phrasing, credential or payment requests, link text vs. visible URL
      mismatch, sender-label inconsistencies). States per design §6. Never
      claims sender verification or live reputation checks.
    written_by: P7-03
  - id: ADR-0013
    title: Local model runtime (C11/C12)
    call: >
      llama.cpp via a pinned JNI build with a Qwen2.5-1.5B-Instruct GGUF Q4
      model (Apache-2.0) imported explicitly by the user through the system
      single-document picker and accepted only if its SHA-256 matches the
      allowlist in the repository. No bundled download, no cloud fallback.
      The feature is optional and off until a model is imported.
    written_by: P8-01
  - id: ADR-0015
    title: Local vision-language models as an optional, grounded OCR tier
    call: >
      Written already as docs/decisions/0015-local-vision-model-ocr-tier.md
      (owner agreed in principle 2026-09-16). Tesseract stays the baseline;
      a user-imported, OSI-licensed VLM (candidates: Qwen3-VL-2B, dots.ocr,
      PaddleOCR-VL, DeepSeek-OCR; LFM2.5-VL and MiniCPM excluded on licence)
      runs in-process on the llama.cpp runtime; every line must be grounded
      either by model boxes or by alignment to Tesseract line boxes; enabled
      only after beating Tesseract on the evaluation set within a device
      budget. Phase P10, release v1.2.0.
    written_by: P10-01
  - id: ADR-0014
    title: Document expiry scope (C8)
    call: >
      One document type: a 'user-declared expiring document'. The user picks a
      category label (passport, ID card, licence, insurance, membership,
      other) as a USER fact; extraction proposes only the expiry date fact
      with evidence. No identity-field extraction.
    written_by: P7-01

