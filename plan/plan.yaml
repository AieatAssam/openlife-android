eading viewer mode in the P3-05 brief. No open questions remain. Plan edits authorised by the coordinator outside the P3-01 entry: findings F-69 and F-70 added to review_findings_index; P1-20 added to P3-05 depends_on in plan.yaml and the brief; plan_version 1.3.1. Approval recorded on 2026-11-26 in C2.md and the ADR-0008 status line as instructed by the coordinator; status stays review until the coordinator reads the final diff."}
