elegate rejects any sqlite_master type='table' that is not an entity ('Unexpected table'), which includes the FTS5 tables and shadow tables; entity tables are still validated; SearchRepositoryTest's Room-validation test does the same. ContentTextField, SourceEgressBoundaryTest, ButtonShapeSourceTest, lock and theme files unchanged. Ideas (not done): a stored folded column or trigram tokenizer if the LIKE fallback is ever shipped; secure_delete for freed FTS pages. Step file status left todo per SCHEMA.md. Review round W-01..W-06: secure-delete on both FTS tables, fail closed (no index without it; LIKE path), SearchIndex.ensure re-checks and rebuilds at every open via SearchIndex.callback in OpenLifeDatabaseFactory; open pragmas unchanged, so PRAGMA secure_delete stays off and deleted base rows/freed pages keep bytes inside the encrypted file until reused (recorded in THREAT_MODEL, C1-R10, ADR-0010); superseded corrections stay indexed as history until the source is deleted. Sanitiser token characters follow unicode61; input with unspaced scripts (Han, kana, Thai, Lao, Khmer, Myanmar, Tibetan) or Indic marks routes to the LIKE substring path; LIKE patterns lowercase ASCII only (W-05). Follow-up (not done): a trigram tokenizer table or unicode61 categories/separators option to serve unspaced and Indic scripts with ranking, Arabic harakat folding, and PRAGMA secure_delete for the whole vault. Existing tests changed this round: SearchIndexHostTest (byte oracle with positive controls in the delete, cascade and update tests; sanitiser test now runs matchExpression directly with no catch and proves raw 'parcel OR zebra' widens; Ärzte assertions in the fallback test; new reopen, ensure, fail-closed and script tests), SearchFixture, HostSqlite (query/transaction proxy, optional file path, corrected recursive_triggers comment), SearchQueryTest, SearchSnippetTest, SchemaV5MigrationTest (secure-delete follows each CREATE), SearchRepositoryTest (byte oracle, secure-delete config