# OpenLife production plan — master tracking file.
#
# Consumers: coding agents (GPT-5.6 Luna via AGENTS.md, Claude Sonnet 5 via
# CLAUDE.md) and the owner. This file tracks phases, steps, status, and
# dependencies. Each step has a companion file under plan/steps/<id>.yaml
# with the complete TDD-mode implementation brief. Agents edit ONLY the
# `status`, `started`, `completed`, `evidence`, and `notes` fields here;
# everything else changes only through a reviewed plan revision.
#
# Reading order for a new agent: AGENTS.md (or CLAUDE.md) -> this file ->
# the step file for the first `todo` step whose depends_on are all `done`.

schema_version: 1
project: OpenLife
plan_version: 1.1.0
plan_date: 2026-09-16   # 1.1.0: design v0.3, ADR-0015 local VLM tier, visual identity (P0-09), phase P10
plan_author: Claude Fable 5.1 (planning session), reviewed by adversarial subagents
baseline_commit: 6df9151
governing_documents:
  - openlife-design-v0.3.md            # product + engineering design; governs on conflict
  - docs/PRODUCT_PRINCIPLES.md         # P1..P7 restated
  - docs/THREAT_MODEL.md
  - AGENTS.md                          # normative rules + GPT-5.6 Luna workflow
  - CLAUDE.md                          # sandbox notes + Claude Sonnet 5 workflow
  - docs/capabilities/C0.md
  - docs/capabilities/C1.md
  - docs/design/VISUAL_IDENTITY.md     # interface identity brief (subordinate to the design)
  - docs/decisions/                    # ADRs; new ADRs are created by steps below

ethos:
  summary: >
    Private, on-device memory for information a person deliberately gives it.
    Provenance before intelligence. User confirms consequences. Small complete
    capabilities. Open source and auditable. Honest limits. No INTERNET, no
    telemetry, no cloud, no backup, no export, no background access.
  non_negotiables:
    - No INTERNET permission in any shipped variant; no networking, analytics, crash-reporting, or remote-model SDK in the dependency graph.
    - Only explicit, single-item intake (share grant or system Photo Picker/single-document picker). No broad storage, media, contacts, SMS, notification-listener, or accessibility-service access.
    - Every extracted or derived value is linked to navigable evidence; user assertions are labelled USER; missing stays missing.
    - The user confirms records and reminders; imports never trigger external actions; no clipboard, share, browser, calendar, or intent egress of content.
    - Original bytes are immutable while retained; derived data carries its own version; corrections are attributable revisions.
    - No plaintext user content in logs, saved instance state, notifications, recents, crash files, caches, or backups.
    - Destructive recovery is never automatic; migrations are never destructive; vault reset is an explicit, separately confirmed action.
    - Never claim a test ran or an audit happened when it did not; "gap" is a legitimate status.

conventions:
  status_values: [todo, in_progress, blocked, review, done, waived]
  status_rules:
    - "todo -> in_progress when an agent starts the step (set `started`)."
    - "in_progress -> review when all acceptance_criteria in the step file are met and verification commands passed; record `evidence` (commit hash, test counts, device)."
    - "review -> done only by the owner or a reviewing agent that did not implement the step."
    - "blocked requires a `notes` entry naming the blocking step or owner decision."
    - "waived requires an owner decision recorded as an ADR under docs/decisions/."
  estimate_scale:
    S: "under half a day of agent work"
    M: "one to two days"
    L: "three to five days"
    XL: "more than a week; must be split before starting if it exceeds two weeks"
  tdd_protocol:
    - "Boundary or regression tests that already pass on the current tree prove RED by a recorded mutation: add the forbidden thing, watch the test fail, revert; the evidence field names the mutation."
    - "For instrumented tests, RED must be an assertion failure, not a compile error (a missing symbol breaks the whole test APK): add the minimal stub signature throwing TODO() first so the suite compiles, then assert. Run one class with ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=<fqcn>."
    - "RED: write the tests named in the step file's tdd.red list first; run them; confirm they fail for the intended reason (compile error or assertion), never because of a typo."
    - "GREEN: write the smallest implementation that makes them pass without weakening validation, recovery, or evidence."
    - "REFACTOR: remove duplication and stale comments; keep behaviour; re-run the affected suites."
    - "VERIFY: run every command in the step file's verification.commands; paste real results into `evidence`."
    - "DOCUMENT: update the docs listed in docs_to_update in the same change; never leave the spec behind the code."
    - "Do not mark a step done with a skipped required test; record it as a gap in docs/verification/ and set status to review with a note."
  branch_and_commit:
    - "One branch per step: plan/<step-id>-<slug>. Commits on that branch at each TDD phase (RED, GREEN, REFACTOR) are expected and need no further permission; each commit builds and passes the JVM suites. Pushing, merging to main, tagging, and any force-push require the owner."
    - "Commit message subject: '<step-id>: <imperative summary>'. Body lists tests added and docs updated."
  schema_migrations:
    - "Room schema versions are assigned at merge time, not in the step file: the merging step takes (current @Database version + 1), names its Migration accordingly, exports the schema JSON, copies it to vault/src/androidTest/assets, and adds a migration test from the previous version. Step files that say 'next schema version' mean exactly this."
    - "Every migration is additive (CREATE TABLE / ADD COLUMN / CREATE INDEX / triggers). Dropping or rewriting a table requires an ADR and a data-preserving copy strategy tested on SQLCipher."
    - "Two steps that both add a migration cannot be merged in the same window without one rebasing onto the other; a migration PR must not merge while another migration PR is open; the second to merge renumbers. Step files never hardcode a version number."
    - "Upgrade-path tests: from P1-12 on, every release keeps its schema JSON, and a test upgrades a database created at each released version through all migrations to the current one (SQLCipher factory), asserting row counts and READY triggers survive."
  native_libraries:
    - "Every shipped .so (SQLCipher, and later Tesseract/llama) must be 16 KB page-size aligned (Android 15+ requirement for targetSdk 35+; Play requires it). scripts/check-16kb-alignment.sh (P0-06) inspects the release APK's libs with the SDK's `check_elf_alignment` logic and fails CI on misalignment; the CI API-36 leg additionally runs on a 16 KB page-size emulator image when available."
  environment_notes:
    - "Emulator launch command, resource limits, and known flakes are in CLAUDE.md. Re-run a connectedAndroidTest that fails with DeadSystemException or 'Can't find service' before blaming the code."
    - "No physical device exists in the sandbox. Steps that need one are marked owner_action and produce a runbook the owner executes."

