review_findings_index:
  # Findings from the planning-session review of the current implementation
  # (commit 6df9151). Each is closed by the named step. Adversarial subagent
  # findings are appended under the same scheme by P0-01 if they arrive later.
  - {id: F-01, severity: high, text: "Abandoned STAGED rows/files persist until next process start; IntakeActivity is noHistory and IntakeViewModel.onCleared never cancels the stage.", step: P1-01}
  - {id: F-02, severity: medium, text: "MainActivity calls contentResolver.getType on the main thread in the Photo Picker callback (same ANR class as the fixed intake bug).", step: P1-02}
  - {id: F-03, severity: high, text: "No BackHandler: back from the viewer exits the app on predictive-back targets.", step: P0-07}
  - {id: F-04, severity: high, text: "OCR results are in-memory only; persisted revisions, corrections, and review state are never reloaded after process restart.", step: P2-01}
  - {id: F-05, severity: high, text: "MlKitOcrEngine does not cancel the recognizer task on coroutine cancellation and recycles the bitmap while the task may still run.", step: P2-02}
  - {id: F-06, severity: medium, text: "Thumbnail cache is unbounded; memory grows with list size.", step: P1-04}
  - {id: F-07, severity: medium, text: "EXIF orientation is never read; camera photos display rotated and OCR regions map wrongly.", step: P1-03}
  - {id: F-08, severity: high, text: "No Reset vault action; VaultUnavailable state has no path forward (design §10).", step: P1-06}
  - {id: F-09, severity: high, text: "ML Kit bundles a telemetry transport SDK; violates P1 wording and blocks F-Droid.", step: P2-03}
  - {id: F-10, severity: high, text: "Release build is unminified and debug-signed; no dependency verification metadata; no SBOM; no licence report.", step: "P0-02, P0-05, P0-06"}
  - {id: F-11, severity: medium, text: "All UI strings hardcoded; default system icon; no dark theme; edge-to-edge not handled on targetSdk 37.", step: P0-07}
  - {id: F-12, severity: low, text: "SourceViewRepository has a default MutationQueue() parameter that silently breaks read/mutation serialisation if used.", step: P1-09}
  - {id: F-13, severity: medium, text: "ArtefactAuthenticator reads the whole artefact file before any length bound is applied.", step: P1-09}
  - {id: F-14, severity: medium, text: "Provider-read deadline closes the stream from another thread; design says cooperative cancellation. Needs an explicit, tested decision.", step: P1-09}
  - {id: F-15, severity: medium, text: "No storage-space precheck; full-disk behaviour untested (design §13 C0-10).", step: P1-05}
  - {id: F-16, severity: medium, text: "App lock decision still open; design requires it settled before real-user distribution.", step: P1-07}
  - {id: F-17, severity: medium, text: "Communication assessment state required from C1 onward (design §6) is absent.", step: P2-07}
  - {id: F-18, severity: low, text: "Stale 'Stage N' comments and placeholder wording in manifest, Vault.kt, SourceDao.", step: P0-08}
  - {id: F-19, severity: medium, text: "CI never runs minSdk 29; local sandbox cannot; a CI emulator can.", step: P0-04}
  - {id: F-20, severity: medium, text: "No Settings/About surface for licences, security level, version, or privacy explanation (P6, P7).", step: P1-08}
  - {id: F-21, severity: low, text: "Plaintext OCR input bytes (up to 16 MiB) are not zeroed after use.", step: P2-02}
  - {id: F-22, severity: medium, text: "No local search although design permits it from C1.", step: P2-08}
  # --- Findings from the adversarial code-audit subagent (2026-09-16), verified against the tree ---
  - {id: F-23, severity: high, text: "Save, cancel, delete, viewer/preview loads, and OCR run execute file I/O, AES-GCM, SHA-256 and bitmap decodes on Dispatchers.Main (viewModelScope / produceState / remember); only prepareImport and thumbnails leave Main.", step: P1-13}
  - {id: F-24, severity: high, text: "OpenLifeApp.vault() has no try/catch around database creation and recovery; a corrupt database, wrong key, or downgrade crashes the app at startup instead of yielding VaultUnavailable.", step: P1-14}
  - {id: F-25, severity: high, text: "Startup recovery decrypts every READY blob and marks CORRUPT on any exception including transient Keystore/IO errors; CORRUPT is permanent; cold start is O(total artefact bytes). Design §11 says authenticate on first read.", step: P1-14}
  - {id: F-26, severity: high, text: "KeystoreWrapper.unwrap calls wrappingKey(), which generates a replacement key when the alias is missing (design §10 forbids silent key creation).", step: P1-14}
  - {id: F-27, severity: high, text: "Viewer evidence overlay scales the region to the 320dp box, not the letterboxed image rect, and ignores orientation; highlights are wrong whenever aspect ratios differ.", step: P2-06}
  - {id: F-28, severity: high, text: "Deleting from the list recycles the thumbnail bitmap while the row may still be composed (recycled-bitmap crash); SensitiveContentCache.put evicts a possibly on-screen bitmap.", step: P1-13}
  - {id: F-29, severity: medium, text: "Viewer/thumbnail reads take the exclusive mutation mutex, so prepareImport's tryAcquire returns Busy during any decrypt; design §11 asks for a read lease that excludes only deletion.", step: P1-15}
  - {id: F-30, severity: medium, text: "OCR final commit (revision READY + span insert) is not in one transaction; cancellation during capture orphans a RUNNING row; markFailed is not NonCancellable.", step: P2-02}
  - {id: F-31, severity: medium, text: "DeletionRepository removes OCR rows and the source row in two statements rather than one transaction (C0-R24 wording).", step: P1-15}
  - {id: F-32, severity: medium, text: "Duplicate detection discards the new stage without authenticating the existing blob (design §9 'verified bytes').", step: P1-15}
  - {id: F-33, severity: medium, text: "A READY source whose blob fails authentication at view time shows 'Verifying…' forever; list caches a silent negative; nothing marks CORRUPT on a genuine tag/digest failure at read.", step: P1-13}
  - {id: F-34, severity: medium, text: "EXTRA_INTAKE_KIND is sender-controlled: any external share can record route PHOTO_PICKER (design §8/§9 acquisition metadata must not be spoofable).", step: P1-02}
  - {id: F-35, severity: medium, text: "Shares declared as image/* (common) are rejected at intent level; MainActivity's own fallback type is image/*; image/jpg variants also fail. Design §8 only requires provider type + magic bytes.", step: P1-02}
  - {id: F-36, severity: medium, text: "VaultAccess.Unavailable is cached for the process lifetime even for transient causes.", step: P1-06}
  - {id: F-37, severity: medium, text: "Rotation during 'Preparing…' before the lifecycleScope open completes cancels the open; the recreated activity skips validation and stays Preparing forever with no Cancel control.", step: P1-13}
  - {id: F-38, severity: medium, text: "OcrViewModel keeps Ready(spans) text for deleted sources and across onStop (C0-R32 background scrub does not cover OCR text).", step: P2-02}
  - {id: F-39, severity: low, text: "backup_rules.xml comment claims an explicit no_backup exclusion in data_extraction_rules.xml that does not exist.", step: P0-08}
  - {id: F-40, severity: low, text: "ML Kit line confidence is a primitive float; a 0.0 sentinel may be persisted as a real confidence (C1-R4).", step: P2-03}
  - {id: F-41, severity: low, text: "Nested equal 15s timeouts: the engine's inner TimeoutCancellationException propagates through the repository as a CancellationException and kills the ViewModel job; UI stuck at Extracting.", step: P2-02}
  - {id: F-42, severity: low, text: "Engine decode/empty-span IllegalArgumentExceptions are misclassified as LIMIT_EXCEEDED.", step: P2-02}
  - {id: F-43, severity: low, text: "Side effects during composition: IntakeScreen calls onDone() for Cancelled inside composition; MainActivity assigns navigation state during composition.", step: P1-13}
  - {id: F-44, severity: low, text: "'Open existing' starts MainActivity without FLAG_ACTIVITY_NEW_TASK, creating a second instance inside the sharing app's task.", step: P1-13}
  - {id: F-45, severity: low, text: "Migration test runs on the plaintext framework helper, not SQLCipher, and does not assert READY-invariant triggers survive migration; VaultTest name says version one.", step: P1-14}
  - {id: F-46, severity: low, text: "docs/verification/C0.md C0-11 cites a non-existent AesGcmCodec.AuthenticationFailedException; release workflow comment claims minification that is off.", step: P0-08}
  - {id: F-47, severity: low, text: "No copy anywhere explains the Photo Picker cloud-provider caveat at intake (design §3 R3, §8 step 2).", step: P1-02}
  - {id: F-48, severity: low, text: "RecoveryReport counts are logged on every start in release builds; make debug-only.", step: P0-08}
  - {id: F-49, severity: low, text: "No runnable test for: C0-R29 Busy from the UI, C0-R30 deadline end-to-end, C0-14 delete-while-viewing clears the viewer, kill-during-deletion, C1-R7 deletion while OCR UI is displayed.", step: "P1-13, P1-15, P2-02"}
