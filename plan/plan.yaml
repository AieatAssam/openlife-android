ionException, got Failed), reverted. Connected: none run (owner instruction: no emulator, no tablet). No CI run id (not pushed). See docs/verification/P1-18-vault-remediation.md.", notes: "Outcome wording (review R-04): anything proven only by an unrun instrumented test is implemented; unverified (gap - pending physical-device run), not fixed. Device gaps (gap - pending physical-device run; exact commands in docs/verification/P1-18-vault-remediation.md): KeystoreWrapperTest, SourceViewRepositoryTest, VaultBootstrapperTest, VerifyAllTest, ImportRepositoryTest, RecoveryRepositoryTest, DeletionRepositoryTest, OcrRepositoryTest, VaultResetRepositoryTest, OcrDatabaseTest (+ R12 trigger mutation), SourceDaoTest, DatabasePragmaTest, and the full vault/app connected suites. R16/V-16 decided by the coordinator (review R-03) on static evidence: sqlcipher-android 4.19.0 re-applies synchronous=NORMAL in SQLiteConnection.open after the hook, and under NORMAL an acknowledged READY commit can roll back on power loss so recovery would delete an item the user saw as saved. DurableWrites sets PRAGMA synchronous=FULL in Room onOpen on the writer connection (JVM-pinned); DatabasePragmaTest (WAL and TRUNCATE) implemented; unverified (gap - pending physical-device run); FULL write latency not measured (gap - pending physical-device run). R17/V-14 deferred: P2-06 not merged. CI-found addition (run 45405099804, API 29 OOM in BoundedStreamReader): chunked reader (no doubling, limit+1 rejection kept, oversized peak ~N+64KiB, proven by forked -Xmx22m JVM test); OutOfMemoryError during the bounded read or the stage encryption only (review R-07) -> PrepareResult.Failed with no STAGED row or stage file: implemented; unverified (gap - pending physical-device run). The 16 MiB + 1 worst case still cannot fit a 16 MiB growth-limit heap, so on API 29 excessBytesAreRejectedAndLeaveNoStagedState may still get Failed instead of EXCEEDS_BYTE_LIMIT. Deviations: SourceDao.update kept for test fixtures only