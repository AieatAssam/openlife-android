id: P0-09
title: Visual identity assets and brand components
phase: P0
status: todo
depends_on: [P0-07]
estimate: M
owner: agent
summary: "Implement docs/design/VISUAL_IDENTITY.md: the mark and wordmark SVGs, bundled OFL typefaces, palette/type/shape tokens, and the three brand composables (StampBadge, FoldedCornerCard, PerforationDivider) with previews and screenshot tests; then apply them across existing screens."
ethos_check:
  - "No visual choice hides a limit or presents an extracted value as established; stamps appear only on confirmed/verified states."
requirements:
  - id: P0-09-R1
    text: "MUST commit art/icon/openlife-mark.svg and art/wordmark.svg matching the brief's geometry, plus the 512 px PNG export for store listings generated by a documented command (rsvg-convert or the Android Studio vector asset flow; record which)."
  - id: P0-09-R2
    text: "MUST bundle IBM Plex Sans (Regular, Medium, SemiBold), IBM Plex Mono (Regular), and Fraunces (variable) under app/src/main/res/font/ with their OFL licence texts included in the licence report and About; total added APK size recorded (target under 1.5 MB with font subsetting to Latin ranges)."
  - id: P0-09-R3
    text: "MUST encode the palette, type scale, and shapes as theme tokens (OpenLifeColors.kt, Type.kt, Shapes.kt) consumed only through MaterialTheme; a JVM test checks every foreground/background pair in the brief's table against WCAG AA (contrast ratio computed in the test, no library)."
  - id: P0-09-R4
    text: "MUST implement StampBadge (rotated −3 degrees, outline, Plex Mono uppercase; variants Confirmed/Verified in stamp green, Stale in amber, Saved in vermilion), FoldedCornerCard, and PerforationDivider as reusable composables with @Preview functions; apply them to the source list, viewer details, intake preview/saved state, and the delete confirmation; the two motion hero moments are implemented with the system animation scale honoured."
  - id: P0-09-R5
    text: "MUST add screenshot tests (Compose ui-test capture via captureToImage on the CI emulator, compared to committed golden PNGs with a 0.5% tolerance) for the three components and the list/viewer/first-run screens in light and dark; goldens are synthetic content only."
  - id: P0-09-R6
    text: "MUST run the installed design skills' checks: .agents/skills/material-3-expressive (hero-moment count, reduced-motion fallback, token usage) and .agents/skills/color-system (contrast, colour-not-alone) and record the review in docs/design/screens.md."
files_touched: [art/, app/src/main/res/font/, app/src/main/java/org/openlife/app/ui/theme/*, app/src/main/java/org/openlife/app/ui/brand/*, docs/design/screens.md, screenshot tests]
tdd:
  red:
    - name: PaletteContrastTest.everyBriefPairMeetsWcagAa
    - name: StampBadgeTest.appearsOnlyForConfirmedVerifiedStaleAndSavedStates
    - name: BrandScreenshotTest.listViewerFirstRunMatchGoldensLightAndDark
    - name: ReducedMotionTest.stampAppearsInstantlyWhenAnimationScaleIsZero
  green: ["Implement assets, tokens, composables."]
  refactor: ["Remove any remaining hardcoded colours/dp radii from screens (detekt custom rule or grep test: no Color(0x in ui/ outside theme/)."]
verification: {commands: ["./gradlew :app:test && ./gradlew :app:connectedDebugAndroidTest", "ls -l app/build/outputs/apk/debug/*.apk (size delta)"], evidence_required: ["Tests; golden diffs; APK size delta; skills review notes"]}
acceptance_criteria: ["Screens match the brief; contrast test green; goldens committed; no hardcoded colours outside the theme."]
docs_to_update: [docs/design/screens.md, docs/generated/THIRD_PARTY_LICENSES.md, fastlane/metadata (icon)]
risks: ["Font licence texts must ship; subsetting must keep the OFL reserved-name rules (rename subset files)."]
rollback: "Theme tokens remain; components unused."
