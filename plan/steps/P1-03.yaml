id: P1-03
title: Display orientation from EXIF
phase: P1
status: todo
depends_on: [P0-07]
estimate: M
owner: agent
closes_findings: [F-07]

summary: >
  Parse JPEG EXIF orientation (tag 0x0112) with a bounded pure-Kotlin parser
  at prepare time, store it in the existing `orientation` column, and apply
  it when rendering previews, thumbnails, the viewer, and when mapping OCR
  regions. Original bytes remain untouched.

rationale: >
  Every accepted Source is recorded as NORMAL today. Photos taken on phones
  are frequently stored rotated with an EXIF orientation, so the viewer shows
  them sideways and OCR evidence regions mapped through OcrCoordinateMapper
  assume the wrong axes. Design §4: "Record display orientation separately."

ethos_check:
  - "P3 provenance: orientation is metadata; bytes are never rewritten."
  - "Untrusted input: the parser is bounded and fails to NORMAL on any malformed EXIF, never throws."

requirements:
  - id: P1-03-R1
    text: "MUST add vault/.../repository/ExifOrientationParser (pure Kotlin, JVM-tested): scans JPEG APP1 segments for 'Exif\\0\\0', reads TIFF header endianness, walks IFD0 entries (max 256), returns Orientation for values 1..8, NORMAL otherwise; never reads beyond bounds; ignores APP1 after SOS; PNG returns NORMAL (eXIf chunk parsing deferred; record as limitation)."
  - id: P1-03-R2

    text: "MUST call the parser in ImportRepository.prepareImportLocked after header validation and persist the result in `orientation`."
  - id: P1-03-R3
    text: "MUST apply orientation in SampledBitmapDecoder (returns a transformed bitmap via Matrix for the 7 non-NORMAL values) for preview, viewer, and thumbnails; the transform happens on the sampled bitmap, never on a full-size decode."
  - id: P1-03-R4
    text: "MUST pass the stored orientation to the OCR engine input (already plumbed) and verify region mapping with a rotated fixture: a synthetic image with text drawn, encoded with EXIF orientation 6 (ROTATE_90) using a test-only EXIF writer, whose OCR evidence region after mapping lies within the expected source-pixel rectangle."
  - id: P1-03-R5
    text: "MUST show orientation in the viewer details as 'Display rotation: 90 degrees' style text when non-NORMAL, and state that the saved bytes are unchanged."

constraints:
  - "No androidx.exifinterface dependency: it parses far more than needed and has had memory issues with hostile input; the bounded parser is under 200 lines."
  - "Orientation values from EXIF are untrusted metadata; the viewer applies them for display only."

design_decisions:
  - "PNG orientation (eXIf chunk) is out of scope for v0.1.0; recorded limitation in docs/capabilities/C0.md."

files_touched:
  - vault/src/main/java/org/openlife/vault/repository/ExifOrientationParser.kt
  - vault/src/main/java/org/openlife/vault/repository/ImportRepository.kt
  - vault/src/test/java/org/openlife/vault/repository/ExifOrientationParserTest.kt
  - vault/src/test/resources/exif/ (synthetic fixtures, generated by a documented script in vault/src/test/java/.../ExifFixtures.kt)
  - app/src/main/java/org/openlife/app/ui/SampledBitmapDecoder.kt
  - app/src/main/java/org/openlife/app/ui/ViewerScreen.kt
  - vault/src/androidTest/java/org/openlife/vault/ocr/OrientedOcrRegionTest.kt (engine-agnostic; uses the registry's engine)

tdd:
  red:
    - name: ExifOrientationParserTest.readsEachOfTheEightOrientationsFromLittleAndBigEndianExif
    - name: ExifOrientationParserTest.returnsNormalForMissingApp1TruncatedIfdAndOutOfRangeValues
    - name: ExifOrientationParserTest.neverReadsPastTheBufferOnHostileOffsets (fuzz-style loop over 10k mutated fixtures, asserts no exception)
    - name: ImportRepositoryTest.exifOrientationIsPersistedWithoutChangingBytesOrDigest
    - name: app androidTest SampledBitmapDecoderTest.rotate90ProducesSwappedDimensions
    - name: OrientedOcrRegionTest.regionsMapBackToSourcePixelsForRotatedInput
  green:
    - "Implement parser, plumb, apply transform."
  refactor:
    - "Share the Matrix construction between SampledBitmapDecoder and MlKitOcrEngine.orient (move to vault model as OrientationTransform)."

verification:
  commands:
    - "./gradlew :vault:test :app:test && ./gradlew :vault:connectedDebugAndroidTest :app:connectedDebugAndroidTest"
  evidence_required:
    - "Test counts; fuzz iteration count."

acceptance_criteria:
  - "A JPEG with EXIF orientation 6 displays upright in preview, list, and viewer; its digest equals the original bytes' digest."

docs_to_update:
  - docs/capabilities/C0.md (new requirement C0-R34 orientation; PNG limitation)
  - docs/reviews/C0-provenance-review.md (orientation paragraph)

risks:
  - "Transformed bitmaps double transient memory; the transform runs on the sampled (<=4M px) bitmap only."
rollback: "Parser returns NORMAL; UI unchanged."
