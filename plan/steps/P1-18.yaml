  - vault/src/main/java/org/openlife/vault/crypto/KeystoreWrapper.kt
  - vault/src/main/java/org/openlife/vault/storage/{VaultBootstrapper.kt,VaultKeyFile.kt,OpenLifeDatabase.kt,OpenLifeDatabaseFactory.kt,SourceDao.kt,OcrDao.kt,SourceMapper.kt,OcrMappers.kt}
  - vault/src/main/java/org/openlife/vault/repository/{ArtefactAuthenticator.kt,ImportRepository.kt,ImportSlot.kt,MutationQueue.kt,RecoveryRepository.kt,DeletionRepository.kt,DuplicateVerifier.kt,SourceViewRepository.kt,OcrRepository.kt,VaultResetRepository.kt,RecoveryReport.kt}
