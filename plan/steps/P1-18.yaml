tdd:
  red:
    - name: vault androidTest KeystoreWrapperTest.nonAeadCipherFailureIsTransientNotAuthentication
      asserts: "Injected IllegalBlockSizeException(cause android.security.KeyStoreException) from doFinal -> KeystoreUnavailableException; AEADBadTagException -> EnvelopeAuthenticationException."
    - name: vault androidTest SourceViewRepositoryTest.keystoreHiccupAtDoFinalLeavesRowReady
    - name: vault androidTest VaultBootstrapperTest.androidKeyStoreExceptionAtUnwrapIsRetryable
    - name: vault androidTest VerifyAllTest.corruptRowThatNowAuthenticatesIsRestoredToReady
    - name: vault androidTest VerifyAllTest.corruptRowWithTransientCheckStaysCorruptAndUnchanged
    - name: vault androidTest VaultBootstrapperTest.missingDatabaseWithKeyAndArtefactsIsDatabaseMissingAndDeletesNothing
      asserts: "Every .blob file and database.key byte-identical before and after; RecoveryRepository not invoked."
    - name: vault androidTest ImportRepositoryTest.failedSaveThatKeepsTheStageKeepsTheSlot
    - name: vault androidTest RecoveryRepositoryTest.cleanAbandonedStagesSkipsAStageWhoseSaveFailedTransiently
    - name: vault androidTest ImportRepositoryTest.slowProviderReadDoesNotBlockViewerReadsOrDeletion
      asserts: "With a provider stalled 10 s, a concurrent loadReadyBytes and a delete complete within 1 s."
    - name: vault test MutationQueueTest.tryMutationReturnsBusyImmediatelyWhenReadersAreActive
    - name: vault test GoldenEnvelopeFixtureTest.forSourceAadArtefactAndWrappedDekMatchCheckedInBytes
    - name: vault androidTest OcrRepositoryTest.transientAuthenticationFailureIsRetryableNotSourceCorrupt
    - name: vault androidTest ImportRepositoryTest.cancellationAfterReadyCommitPropagatesAndRowIsReady
    - name: vault androidTest DeletionRepositoryTest.cancellationIsNotSwallowedByGenericCatch
    - name: vault test VaultKeyFileTest.keyFileIsWrittenViaTempAndRename
    - name: vault androidTest VaultBootstrapperTest.tornKeyFileWithNoDatabaseAndNoArtefactsIsFreshInstall
    - name: vault androidTest VaultResetRepositoryTest.strayNonUuidFileAndJournalDoNotBlockReset
    - name: vault androidTest OcrDatabaseTest.readyInvariantTriggersExistAfterMigratingToCurrentVersion
      asserts: "Mutation: drop the shared trigger call from the migration path -> test fails; revert (recorded in evidence)."
    - name: vault androidTest SourceDaoTest.compareAndSetStateTransitionLosesRaceExplicitly
      asserts: "Two writers from the same STAGED snapshot: exactly one affected row; the other gets a typed lost-race result; no field from the stale snapshot is written."
    - name: vault test EnumDecodingTest.unknownStoredValuesDecodeToFallbackWithoutCrash
    - name: vault androidTest RecoveryRepositoryTest.unknownSourceStateIsNeitherShownNorDeleted
    - name: vault androidTest RecoveryRepositoryTest.injectedFileOpsFaultReachesRecovery
    - name: vault androidTest DatabasePragmaTest.effectiveSynchronousAndJournalModeAreRecorded
      asserts: "Prints journal_mode/synchronous; asserts synchronous == FULL (2). If it already passes on the unchanged tree, record 'V-16 refuted' with the observed values instead of a fix."
  green:
    - "Narrow the Keystore exception mapping; add DATABASE_MISSING; move slot release and the provider read; make tryMutation non-waiting; add the forSource golden; switch OCR to check(); rethrow cancellation; atomic key write; tolerant reset; shared trigger DDL; CAS DAO statements; tolerant enum decoder; inject file ops; set synchronous=FULL only if R16's test shows it is needed."
  refactor:
    - "One ExceptionClassifier for Keystore failures shared by KeystoreWrapper and VaultBootstrapper; remove the duplicated class-name checks."
    - "Delete Vault.SCHEMA_VERSION/VaultTest only under R17's condition."

verification:
  commands:
    - "./gradlew detekt lint :app:test :vault:test assembleDebug"
    - "./gradlew :vault:connectedDebugAndroidTest :app:connectedDebugAndroidTest"
    - "scripts/plan-check.sh"
  evidence_required:
    - "Commit hashes per TDD phase; JVM and connected counts; the AOSP exception answer for R1 with source reference; observed PRAGMA values for R16; recorded mutations for guard tests; CI API 29/36 run ids."

acceptance_criteria:
  - "No code path marks a row CORRUPT except an AEAD tag failure or a digest mismatch, and a CORRUPT row whose bytes authenticate is restored to READY by Verify all items."
  - "A lost database with a surviving key file and artefacts deletes nothing and shows a DATABASE_MISSING explanation."
  - "A slow provider read never blocks viewer reads, deletion, or the foreground cleanup pass; a save that keeps its stage keeps its slot."
  - "Every state transition in SourceDao/OcrDao is compare-and-set; no stored enum value can crash decoding."
  - "Every finding in scope has a recorded outcome in docs/verification/P1-18-vault-audit-remediation.md backed by a test run; V-16 is decided by observed pragma values."

docs_to_update:
  - docs/verification/P1-18-vault-audit-remediation.md (new)
  - docs/verification/C0.md (C0-09, C0-11, C0-12 rows)
  - docs/capabilities/C0.md (C0-R12 skip semantics, C0-R16 slot, DATABASE_MISSING under C0-R36/ADR-0005)
  - docs/decisions/0005-vault-reset.md (addendum - DATABASE_MISSING, torn key file)
  - docs/THREAT_MODEL.md (transient vs authentication failure; power-loss durability from R16)

risks:
  - "Narrowing the authentication mapping could hide a real tamper that surfaces as a non-AEAD exception; mitigated because the envelope also checks its own digest and framing, and R1 records what AOSP actually throws."
  - "Moving the provider read outside the lease changes timing in ImportRepositoryTest and IntakeScreenFlowTest; keep awaits state-based."
  - "CAS updates surface races that full-row writes silently hid; each lost-race branch needs an explicit, tested outcome."
  - "Overlaps P2-06 (PR #23) in OcrDatabaseTest and migration helpers; rebase whichever lands second."
rollback: "Per-requirement revert; no schema change, so every item reverts independently. Revert R16's pragma separately if it measurably regresses save latency (record the numbers)."

