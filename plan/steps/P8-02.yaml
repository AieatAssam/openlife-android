    text: "MUST write C11.md: prompt template versioned, output grammar (constrained JSON via GBNF), citation validation (every value must map to span text by offset or exact substring), abstention, limits, injection resistance tests, evaluation gate showing improvement over rule-based proposals on the eval sets (design §14: 'must improve a measured task before it earns a dependency or storage budget')."
  - id: P8-02-R2
    text: "MUST implement ProposalValidator (pure Kotlin) rejecting uncited or non-substring values, and map proposals to DERIVED fact revisions with methodId 'llm-<model>-<prompt-version>' and fact_inputs to the OCR spans' extracted facts where they exist."
  - id: P8-02-R3
    text: "MUST prove the model cannot act: no tool interface exists; injection fixtures produce no side effects (test)."
