summary: "Optional on-device semantic proposals: the model receives OCR text (as data, in a constrained prompt with span ids) and returns structured proposals (event/purchase/document candidates) that must cite span ids; proposals without valid citations are discarded; everything remains a proposal for the existing confirmation flows; model output is untrusted. Spec C11.md first (this step); the evaluation gate and enabling the feature are P8-03."
requirements:
