notes: >
  Synthetic only. Text part: eval/facts/v1/text.tsv (200 rows, expectations
  written from ADR-0008 and amendments, never from extractor output). Image
  part (P3-06-R1): eval/facts/v1/image-cases.tsv and images/ (30 PNG, truth JSON,
  manifest), rendered by ./gradlew :eval:generateFactsImages.
  The step's command was written as --tests '*FactsImageEval*'. The tablet run
  used the class argument with the p306FactsImage opt-in (one class per run).
  The instrumented test does not assert the gate. It fails only for an invalid
  set or an unprocessed image (FactsImageEval.kt header). The image gate is a
  recorded measurement; the JVM gate is the enforced one.
  Status: review, set after the gate command passed. Acceptance "Gate met and
  recorded" is NOT met for the image part (R2 FAILS on both engines). The
  reviewer decides whether that blocks P3-08.
  Known deviations and findings (follow-ups, not fixed here):
  D-1 (M-20): two silent MONEY misses in the text part (ADR-0008 5.4 lines 521
  and 549); also an extension in the single-line form. Kept, reported.
  D-2 (T-14): bare 1430 abstention not recorded (ADR-0008 line 314). Kept, reported.
  F1 OCR space drops: Tesseract img-16 "9:15 am" read "9:15am" (TIME, canonical
  09:15 correct, scored UNEXPECTED); Tesseract img-20 "+1 555 123 4567" read
  "+1555 123 4567" (PHONE, canonical correct, scored UNEXPECTED); ML Kit img-14
  URL read with a space before "#top", truncating the URL to
  https://example.org/a?b=1&c=2 (a wrong value). Matching is exact on the raw
  slice (README), so the extractor cannot recover a dropped space. Owner
  decision: OCR-side normalisation or a stated matching rule.
  F2 img-21 extractor gap (ML Kit): "Doors 6:00 pm -11:00 pm" gives no candidate
  and no abstention for either time. Check the time-range rules (ADR-0008 4.2).
  F3 img-30 en dash (ML Kit): "Coffee – €3.50" read "Coffee-€3.50", producing a
  wrong MONEY -€3.50 (-3.50 EUR) on the negative row. Check the sign rule
  (ADR-0008 5.1 to 5.2) and whether OCR should normalise the dash.
  F4 img-19 (ML Kit): "1:30 pm" read "1:30 pmn". The result is an UNEXPECTED
  clarification DATE 01:30 | 13:30, which lowers DATE precision (it is not a
  definite value and is not in wrong_definite), and a silent miss on "1:30 pm".
  The classifier calls the miss EXTRACTOR_MISS; the cause is borderline because
  the OCR text is not clean.
  F5 deviation: the image path does not use the Room / FactExtractionCore path
  from P3-04. It runs FactExtractor.extract on the OCR spans. Follow-up: run the
  image set through the repository path when P3-05 or P3-07 need it.
  F6 conflict: the brief said images are rendered to a bitmap on the device.
  They are host-rendered PNG assets, reusing the P2-04 renderer and IBM Plex,
  packaged into the androidTest APK. Owner decision.
  F7 gap: abstention and evidence-location correctness per kind are not reported
  for the image part (R1 asks for them).
  Surface-form miss split (the classifier reports both):
  Tesseract 2 misses, OCR_MISREAD 2 (img-16, img-20). Whitespace-insensitive:
  EXTRACTOR_MISS 2. The first tablet run classified whitespace-insensitively
  only; the metrics were the same, and the classifier now records both (3f76a56).
  ML Kit 5 misses, OCR_MISREAD 2 (img-14, img-17 "¥500" read "500"),
  EXTRACTOR_MISS 3 (img-19, img-21 x2). Whitespace-insensitive: EXTRACTOR_MISS 4,
  OCR_MISREAD 1.
  Open: a background :app:testDebugUnitTest run reported BUILD FAILED with no
  test name in its log. A foreground rerun passed (5s). The cause is not found.
  Dependency P3-04 was at review when this step started. Adversarial review is
  not required by this step (not in the owner's list of specification steps)
  and was not run.
