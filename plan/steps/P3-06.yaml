id: P3-06
title: Facts evaluation set and metrics
phase: P3
status: review
started: 2026-11-28
depends_on: [P3-04]
estimate: M
owner: agent

summary: >
  Extend the eval module with a facts set: synthetic OCR-like text and images
  with ground-truth facts; measure precision/recall per kind, wrong-value
  rate, clarification correctness, and specifically wrong actionable dates.

requirements:
  - id: P3-06-R1
    text: "MUST add eval/facts/v1 with 200 text cases (JVM, fast) and 30 image cases (instrumented, through OCR) with truth per kind; metrics per rule version written to docs/verification/facts-eval.md. Amended 2026-11-26 (P3-01 adversarial review; C2.md governs): the 30 image cases and C2 acceptance wait for the OCR gate to be measured; the 200 JVM text cases do not (decision Q-12); report abstentions and evidence-location correctness per kind (decision Q-3)."
  - id: P3-06-R2
    text: "MUST define the gate: date precision >= 0.97 (a wrong date is worse than a missed one), recall >= 0.85; money precision >= 0.95; URL/email/phone precision >= 0.95; 100% of ambiguous d/m cases flagged CLARIFICATION_NEEDED; zero currency inferred from a bare symbol. Amended 2026-11-26 (P3-01 adversarial review; C2.md governs): TIME and DATETIME are gated as DATE (decision Q-3); 'zero currency inferred from a bare symbol' also covers a code taken from context (ADR-0008 5.4); a clarification whose candidates contain the truth is not a wrong value."
  - id: P3-06-R3
    text: "MUST run the JVM part in `:vault:test` (fast) so every change checks it; the image part is @Slow on main-branch CI."

files_touched: [eval/facts/v1/*, vault/src/test/.../facts/eval/*, vault/src/androidTest/.../facts/eval/*, docs/verification/facts-eval.md]
tdd:
