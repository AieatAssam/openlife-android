id: P4-02
title: Record and action schema with dependency edges and staleness
phase: P4
status: todo
depends_on: [P4-01]
estimate: M
owner: agent
summary: "Implement the C3 entities, migration, DAOs, EventRepository and ReminderRepository (persistence only; scheduling in P4-04), invariants as triggers, and cascade deletion."
requirements:
  - id: P4-02-R1
    text: "MUST add EventRecordEntity, EventRecordRevisionEntity, ReminderEntity with FKs to sources and fact_revisions (ON DELETE CASCADE) and a migration with exported JSON."
  - id: P4-02-R2
    text: "MUST enforce: CONFIRMED event revision requires dateFactRevisionId to reference a fact revision with status CONFIRMED (trigger joining fact_revisions) or a USER-origin revision; reminder trigger must be in the future at scheduling time (repository check)."
  - id: P4-02-R3
    text: "MUST implement staleness propagation in FactRepository hooks: when a fact revision goes STALE or is superseded, dependent event revisions become STALE and their reminders SUSPENDED (persisted; the scheduler in P4-04 observes and cancels alarms)."
  - id: P4-02-R4
    text: "MUST extend DeletionRepository and VaultResetRepository to remove records/reminders explicitly in the same transaction and to invoke a `ReminderCanceller` seam (implemented in P4-04)."
  - id: P4-02-R5
    text: "VS-2 (docs/reviews/2026-11-24-vault-audit.md): MUST register every record, revision and reminder dependency in P3-02-R6's dependency-edge table: an event that depends on facts from more than one source uses RESTRICT edges, so deleting one source invalidates the event (STALE, reminder SUSPENDED) instead of cascading it away while another source is retained; record titles in FTS are maintained by triggers only."
