risks:
  - "Biometric class: BIOMETRIC_WEAK on API 26-29 is weaker than STRONG; the device credential fallback is unchanged."
  - "Light navigation bar on API 26 depends on the activity's WindowInsetsControllerCompat call, not on the theme; unverified on a device."
  - "The CI matrix still has only API 29 and API 36 legs; no API 26 leg was added (emulators are forbidden for this owner)."

rollback: "Restore minSdk 29 in app/build.gradle.kts and vault/build.gradle.kts, restore the USE_FINGERPRINT tools:node=remove line, restore the ManifestBoundaryTest set, and revert the theme move."

