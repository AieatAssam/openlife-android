  - app/src/main/res/values/themes.xml, values-night/themes.xml, new values-v27/themes.xml, values-night-v27/themes.xml
  - app/src/test/java/org/openlife/app/boundary/ManifestBoundaryTest.kt
  - app/src/test/java/org/openlife/app/boundary/ApiLevelResourceTest.kt (new)
  - app/src/test/java/org/openlife/app/lock/AllowedAuthenticatorsTest.kt (new)
  - app/src/androidTest/java/org/openlife/app/lock/AppLockFlowTest.kt (API 26-29 condition)
  - app/src/androidTest/java/org/openlife/app/ui/SecureWindowUiTest.kt (WindowInspector is API 29+; skip below)
  - app/src/main/java/org/openlife/app/settings/VaultSecurityInfo.kt (comment: securityLevel is API 31+)
  - docs/PERMISSIONS.md, docs/decisions/0019-min-sdk-26.md (new), docs/decisions/0001-c0-defaults.md, docs/decisions/0004-app-lock.md (dated amendments)
