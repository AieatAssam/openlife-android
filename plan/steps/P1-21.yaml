tdd:
  red:
    - name: ManifestBoundaryTest.releasePermissionsAreExactlyTheAllowlist (expected set now includes USE_FINGERPRINT)
    - name: ManifestBoundaryTest.legacyFingerprintPermissionIsLimitedToApiBelow28 (USE_FINGERPRINT present with maxSdkVersion 27)
    - name: AllowedAuthenticatorsTest (API 26-29 -> WEAK|CREDENTIAL; API 30+ -> STRONG|CREDENTIAL), stub throws TODO()
    - name: ApiLevelResourceTest.lightNavigationBarAttributeIsOnlyDeclaredFromApi27 (attribute only in values-v27 and values-night-v27)
  green:
    - "minSdk 26; AppAboutPort inline SDK_INT guard for signingInfo (28+) and signatures (below 28) with a targeted @Suppress('DEPRECATION') and comment; BiometricPromptAuthenticator.allowedAuthenticatorsFor(sdkInt); theme attribute moved to values-v27 and values-night-v27; manifest USE_FINGERPRINT maxSdkVersion 27; AppLockFlowTest A-12 condition covers API 26-29; SecureWindowUiTest skips below API 29 with a stated reason."
  refactor:
    - "Comments and KDoc that name API 29 as the lowest level; ADR and docs amendments."

verification:
  commands:
    - "./gradlew detekt lint :app:test :vault:test assembleDebug :vault:compileDebugAndroidTestKotlin :app:compileDebugAndroidTestKotlin :eval:test"
    - "scripts/plan-check.sh"
    - "bash scripts/tests/run.sh"
  evidence_required:
    - "Real output of each command (test counts, BUILD SUCCESSFUL or FAILED, plan-check errors=0, run.sh passed/failed counts)."
    - "Merged release manifest excerpt showing USE_FINGERPRINT with maxSdkVersion 27 and no INTERNET."
    - "Lint XML shows zero errors."

acceptance_criteria:
  - "minSdk is 26 in app and vault; the lint run has no errors."
  - "USE_FINGERPRINT appears in the merged release manifest only with maxSdkVersion 27."
  - "The authenticator set and signing path are chosen by API level and covered by JVM tests."
  - "Every device behaviour below API 29 is listed as unverified in docs/verification/P1-21-min-sdk-26.md, with a device checklist."

