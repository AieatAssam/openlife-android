id: P1-21
title: Support Android 8.0 (API 26)
phase: P1
status: in_progress
started: 2026-11-27
depends_on: [P1-08]
estimate: M
owner: agent

summary: >
  Lower minSdk from 29 (Android 10) to 26 (Android 8.0), the owner's decision
  of 2026-11-27: the only available test device is an API 26 tablet. Fix every
  API-level lint error the change exposes, keep the API 26-27 fingerprint
  permission and the API 26-29 device-credential lock path correct, and record
  what is unverified on a device.

rationale: >
  The product's stated lowest version (design v0.3, ADR-0001 item 2) was chosen
  before the owner had a device. Below API 28 the signing data is only the
  legacy `signatures` array; below API 30 the biometric prompt cannot use STRONG
  with the device credential; below API 27 the light navigation-bar attribute
  does not exist; the androidx.biometric library needs the legacy
  USE_FINGERPRINT permission below API 28. Each of these must be handled
  explicitly rather than left to lint.

ethos_check:
  - "Honesty: device behaviour below API 29 is not claimed as verified. Every device check is listed as a gap in docs/verification/P1-21-min-sdk-26.md."
  - "Least privilege: USE_FINGERPRINT is restored only for maxSdkVersion 27; INTERNET stays absent."

requirements:
  - id: P1-21-R1
    text: "MUST set minSdk 26 in app and vault, with compileSdk and targetSdk unchanged."
  - id: P1-21-R2
    text: "MUST fix every lint error from the trial build (lintDebug, 5 errors) with a version check or an API-correct path. No blanket lint suppression and no baseline entry."
  - id: P1-21-R3
    text: "MUST read the signing certificate with GET_SIGNING_CERTIFICATES and signingInfo on API 28+, and with the legacy signatures array below API 28; both paths yield the certificates that signed the installed APK."
  - id: P1-21-R4
    text: "MUST declare the light navigation-bar appearance (windowLightNavigationBar, API 27+) only in values-v27 and values-night-v27. Below API 27 the appearance is set by the activity's edge-to-edge code (WindowInsetsControllerCompat)."
  - id: P1-21-R5
    text: "MUST restore android.permission.USE_FINGERPRINT with android:maxSdkVersion=27 in the app manifest, so the merged release manifest carries it only for API 26-27 and INTERNET stays absent."
  - id: P1-21-R6
    text: "MUST keep BIOMETRIC_WEAK | DEVICE_CREDENTIAL for API 26-29 and BIOMETRIC_STRONG | DEVICE_CREDENTIAL for API 30+. Comments and tests MUST NOT describe API 29 as the lowest supported level."
  - id: P1-21-R7
    text: "MUST NOT weaken any test. A device test that needs a newer API MUST skip with a stated reason and be listed as a gap, never pass silently."

constraints:
  - "No StrongBox (setIsStrongBoxBacked is API 28+) and no setUnlockedDeviceRequired (API 28+) are used or added below API 28."
  - "No emulator and no adb (owner instruction 2026-11-27). Instrumented tests are compiled only."
  - "No push; commits on plan/minsdk-26 only."

