id: P3-05
title: Facts UI with origin badges, review, user-provided facts, inert values
phase: P3
status: review
started: 2026-11-28
depends_on: [P3-04, P1-20]
estimate: L
owner: agent

summary: >
  Show facts per source with origin and status badges, evidence navigation
  into the viewer (P2-06 selection), confirm/reject/clarify flows, and a
  form to add a USER fact; values are rendered inert.

ethos_check:
  - "P3/P4: confirmation is per fact, focused on values that change outcomes; no link opening, no copy; USER facts visibly labelled."

requirements:
  - id: P3-05-R1
    text: "MUST add a Facts panel in the viewer (and a Facts route for a full list) grouped by kind, each row: canonical value, origin badge (Extracted / Extracted, from your correction / You), status chip (Unreviewed / Confirmed / Rejected / Needs clarification / Stale), 'Show evidence' action selecting the span+region, and for CLARIFICATION_NEEDED a chooser listing the candidates (e.g. 3 April 2026 vs 4 March 2026) whose choice creates a USER-origin revision superseding the extracted one (status CONFIRMED) — never mutates the extracted revision. Amended 2026-11-26 (P3-01 adversarial review; C2.md governs): 'Show evidence' opens the reading the evidence row names, read-only when it is an earlier reading (C2-R39, Q-15); a clarification can be re-chosen (C2-R36); add 'Correct this value' (C2-R37, decision Q-1); no fact value in saved state, route arguments or notifications (C2-R54); per decision Q-2 this step depends on P1-20; per decision Q-15 the viewer gains a read-only 'earlier reading' mode, labelled 'An earlier reading of this item', used only to show evidence on a non-current reading."
  - id: P3-05-R2
    text: "MUST provide 'Add a fact' with kind picker and typed input (DatePicker for dates, time picker, decimal + currency code chooser, text for URL/email/phone) creating a USER revision with createdAt and no evidence."
  - id: P3-05-R3
    text: "MUST render URLs/emails/phones as plain text with a note 'OpenLife does not open links or copy them'; no ClickableText, no selection, no LinkAnnotation."
  - id: P3-05-R4
    text: "MUST show stale facts greyed with 'The text this came from changed' and a 'Re-extract' action. Amended 2026-11-26 (P3-01 adversarial review; C2.md governs): the action is labelled 'Find facts again' and the stale display follows C2-R41."
  - id: P3-05-R6
    text: "MUST display dates, times, and amounts locale-formatted (java.time formatters, NumberFormat with the ISO code) while storage stays canonical; a test switches locale and asserts the stored canonical value is unchanged."
  - id: P3-05-R5
    text: "MUST pass accessibility checks (P1-10 rule) and large-font layout tests."

files_touched:
  - app/src/main/java/org/openlife/app/ui/facts/{FactsPanel.kt,FactsScreen.kt,AddFactSheet.kt,FactsViewModel.kt}
  - navigation routes
  - tests: app androidTest FactsScreenTest, FactsFlowTest

tdd:
  red:
    - name: FactsScreenTest.showsOriginAndStatusBadgesAndEvidenceNavigation
    - name: FactsScreenTest.clarificationChoiceCreatesUserRevisionAndLeavesExtractedIntact
    - name: FactsScreenTest.urlIsInertAndNotSelectable (assert no LinkAnnotation semantics, no clickable)
    - name: FactsFlowTest.addUserFactPersistsWithUserOriginAndNoEvidence
    - name: FactsFlowTest.staleFactIsGreyedAndReextractCreatesNewRevisions
  green: ["Implement."]
  refactor: []

verification:
  commands: ["./gradlew :app:test && ./gradlew :app:connectedDebugAndroidTest"]
  evidence_required: ["Tests; accessibility check results"]
acceptance_criteria: ["A user can confirm the date on a synthetic appointment screenshot and see its evidence in two taps."]
docs_to_update: [docs/capabilities/C2.md]
risks: []
rollback: "Hide panel."
notes: >
  Brief from the P3-03 review (2026-11-26, coordinating session). C2-R38
  needs a single-value validation and normalisation entry point for a
  value the user types or chooses (one date, time, amount, URL, email or
  phone). P3-03 did not build it because it is not trivial: the
  extractors scan a line and claim characters rather than validate one
  value. Build it here, reusing the per-kind rules and TypedValue.
  P3-02 review M-08 (2026-11-26): FactRepository.addUserFact and correct
  check a user value's shape per kind (UserValueShape). DATE, TIME and
  DATETIME are checked completely (canonical JSON, a real date or time,
  canonicalText derived from it). MONEY, URL, EMAIL and PHONE are checked
  only for their leading key; their full validation with the extractors'
  normalisers (C2-R38, C2-R5) belongs to this step's input screens, using
  P3-03's normalisers, and must refuse an input they reject before calling
  the repository.
  P3-05 implementation notes (2026-11-28, Haiku agent under the coordinating session):
  - Dependency deviation: depends_on P3-04 and P1-20 are both status review, not done (plan-status lists nothing runnable). The coordinating session directed this step; it proceeds on that instruction and the owner should confirm the order before review.
  - Money "not stated" (C2-R38 vs ADR-0008 §3, §5): ADR-0008 stores a null currency only with a printed symbol (rawSymbol required), and MoneyValue requires a code or a symbol. A "Not stated" amount with no symbol therefore cannot be stored. The normaliser refuses it (MONEY_NEEDS_CODE) with a visible message. OPEN QUESTION for the owner: allow a user-typed symbol, or drop "Not stated" from C2-R38.
  - Money chooser: CAD is not offered. The line scanner gives no single value for "10 CAD" (ADR-0008 §5.5 English-word code list); the other 10 codes accept whole and fraction amounts (UserValueNormaliserTest.everyChooserCodeAcceptsPlainIntegerAndFractionAmounts).
  - Handed-over finding (a), viewer shows the latest reading while search and facts use the READY pointer: NOT changed in P3-05. C2 decision Q-6 assigns moving the viewer and search onto the pointer to P3-07.
  - Handed-over finding (b), fact hit in search opens the viewer without a facts panel: NOT routed in P3-05. P3-07-R2 owns "tapping opens the Facts panel with the fact highlighted"; P3-05's requirements do not mention search.
  - Earlier-reading viewer mode (Q-15, C2-R39): NOT implemented in P3-05. The viewer loads only the current reading (OcrRepository.observeOcrView, ViewerSession); a reading-by-id mode needs new viewer state across ViewerSession, ViewerPorts and OcrPresenter. Recorded as a stated R1 gap.

  P3-05 close-out (2026-11-28):
  Item 1 (200 % title) fixed by an autosizing title (16 sp floor); item 2 kinds DATE, TIME, MONEY each red then green with
  JVM presenter tests and one FactsFlowTest case; item 3 host tests added in 66946ce. The review action row
  (Confirm/Reject) was broken by item 1's fillMaxWidth labels (a zero-bounds second button, caught on the tablet);
  fixed in 01180c1 by weighting the buttons. Open: FactsScreenTest final-code run (device locked; the lock was not
  touched). Not built: earlier-reading viewer mode (Q-15), "Correct this value" (C2-R37), CAD in the currency chooser.
  Owner decisions still needed: money with no currency code (ADR-0008 vs C2-R38), and the dependency order (P3-04
  and P1-20 are review, not done). Device gaps recorded in docs/verification/P3-05-facts-ui.md.

  P3-05 close-out 2 (2026-11-28, coordinating session directed A, B, C, device runs):
  A (C2-R37) "Correct this value" committed (7c7c2d3, ee3d88d): the same typed input as Add a fact, refusal before the gateway.
  B (C2-R39) earlier reading opens read-only with a label and no mutating action; "Show evidence" on an earlier reading
  routes to that reading (64925cc, 1351d4a, ba13ff8, 5ffd3b0, c2664bc). The earlier "not implemented (Q-15)" gap is closed.
  C (C2-R36) a clarified value can be re-chosen from its candidates; the writer exposes candidatesOf with the same checks as
  clarify, and the panel labels the value in use as the current choice (0f5c767, d9b428c, 3dcdef4).
  Detekt for A to C in 0bccd96; device fixture order fixed in 5488566 (FactsFlowTest 13/13 after the fix, 12/13 before it).
  Device totals on 5488566: FactsFlowTest 13/0, FactsScreenTest 1/0, EarlierReadingViewerTest 2/0, ViewerScreenTest 3/0,
  ViewerScreenC1Test 10/0, EvidenceNavigationTest 8/0 (37 of 37). Not re-run this session: FactsInertValuesTest,
  LargeFontUiTest, ScreenSemanticsTest (known failures from 01180c1 stand). Open: DATETIME has no input form, so Correct is
  not offered for it; USER BASIS "You chose this from:" not implemented; owner decisions on money with no currency code and
  on the dependency order (P3-04, P1-20 are review). Status stays review. Not pushed.

  Review fixes U-01..U-06 and cleanup (branch commits b2e8441, eb9757d, 39e1251, a9dd719, 6fedd04, 872c558, edddeae):
  each finding has a JVM or host test that passes on the final tree. RED was observed for U-05 and U-06 and for the
  coordinator follow-ups 1, 2 and 4; the RED runs for U-01 to U-04 are not recorded. Facts writes run in the
  application scope. Open: the U-03 read-only guard has no instrumented test; see
  docs/verification/P3-05-facts-ui.md "Review fixes U-01..U-06 and cleanup".


