id: P1-09
title: Repository and crypto hardening
phase: P1
status: todo
depends_on: [P0-03]
estimate: M
owner: agent
closes_findings: [F-12, F-13, F-14]

summary: >
  Close the small but real repository-level issues: bound artefact file
  reads by length before allocation, remove the dangerous default
  MutationQueue parameter, make the provider-read deadline an explicit,
  tested cooperative-cancellation design, and add plaintext buffer
  zeroisation where the design asks for it.

rationale: >
  ArtefactAuthenticator.readBytes() allocates the whole file before
  EnvelopeCodec's length bound runs; a corrupted multi-hundred-megabyte file
  would OOM the process before failing closed. SourceViewRepository's default
  `MutationQueue()` would silently break the read/deletion lease if a caller
  omitted the argument. The 15-second deadline closes the stream from another
  coroutine, which the project's own notes flag as hazardous.

ethos_check:
  - "Fail closed before allocation (design §10 'Bound lengths before allocation')."

requirements:
  - id: P1-09-R1
    text: "MUST check `artefactFile.length()` against EnvelopeFormat.MAX_CIPHERTEXT_LENGTH + header before reading in ArtefactAuthenticator, VaultKeyFile.read, and any other file read; oversize -> authentication failure (null), never an allocation."
  - id: P1-09-R2
    text: "MUST remove the default value of `mutationQueue` in SourceViewRepository and any other repository; the composition root passes the shared instance; SourceEgressBoundaryTest gains a grep assertion that `MutationQueue()` is constructed only in OpenLifeApp and test code."
  - id: P1-09-R3
    text: "MUST redesign the provider-read deadline: BoundedStreamReader.read takes a `deadline: () -> Boolean` (or a CancellationToken) checked between 64 KiB chunks and throws a typed ReadDeadlineExceededException; IntakeViewModel uses withTimeout around prepareImport and the stream is closed by the owning coroutine in `finally` on the same thread that opened it; the cross-thread close is kept ONLY as a last-resort unblock for a provider that never returns from read(), executed after a second grace period (deadline + 5 s), documented in code and THREAT_MODEL as a known hazard with rationale."
  - id: P1-09-R4
    text: "MUST zero plaintext byte arrays that the repository owns after use: prepareImport's read.bytes after encryption and validation; OcrRepository's captured bytes after the engine returns (P2-02 does the OCR side; this step does import). Compose-held preview bytes are cleared when the state leaves Preview (set to null and let GC; document the JVM zeroisation limit)."
  - id: P1-09-R5
    text: "MUST keep MutationQueue's semantics unchanged in this step (P1-15 redesigns leases); reference the existing viewerReadSharesTheMutationQueueWithDeletionWork test as the regression that must stay green here."

constraints:
  - "No behaviour change to envelope format or AAD."

