    - name: EvidenceNavigationTest.pinchReleaseDoesNotSelect
      asserts: "E-02: two-pointer gesture then lift -> no selection."
    - name: EvidenceNavigationTest.doubleTapAtThreeTimesZoomsOutEvenWhenTheFirstTapPans
      asserts: "E-02: pointerInput not restarted by pan."
    - name: OcrDatabaseTest.sqlcipherMigrationToCurrentVersionKeepsRowsAndReadyTriggers
      asserts: "E-04: SQLCipher factory + readyInvariantCallback; v2 row counts and trigger RAISE text after migration."
    - name: OcrDatabaseTest.latestSpanReviewIsChosenBySequenceNotClock
      asserts: "E-05: two reviews inserted with createdAt going backwards -> the later insert is current."
    - name: ViewerScreenC1Test.rejectedSpanOffersUndoAndCannotBeRejectedTwice
