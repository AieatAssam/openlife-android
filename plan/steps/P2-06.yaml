      asserts: "E-08: mutation - remove BuildConfig.DEBUG guard -> fails."
    - name: ViewerScreenC1Test.spanRowKeepsUsableTextWidthAtNarrowWidthAndLargeFont
      asserts: "E-09 confirm/refute."
    - name: OcrRepositoryTest.regionBeyondSourceBoundsIsNotPersistedAsGrounded
      asserts: "E-10."
  green:
    - "Implement geometry, zoomable image, panel, schema v3."
  refactor: []

verification:
  commands:
    - "./gradlew :app:test :vault:test && ./gradlew :vault:connectedDebugAndroidTest :app:connectedDebugAndroidTest"
    - "Manual on emulator with a tall screenshot and a wide receipt: highlight sits on the text."
  evidence_required:
    - "Tests; manual transcript (uiautomator dumps cannot show overlays; use a debug-only bounds log behind BuildConfig.DEBUG that prints rects, removed before merge or kept debug-only)."

acceptance_criteria:
  - "Highlights align with text for arbitrary aspect ratios and orientations; span and region selection work both ways; per-span review persists across restart."
  - "Plan 1.3.0: alignment and hit-testing are proven at >1x zoom (or zoom is removed under the rollback); taps never fire after a drag or pinch; the v2->v3 upgrade is proven on SQLCipher; every E-01..E-10 outcome is recorded (docs/reviews/2026-11-24-P2-06-pr23-review.md)."

docs_to_update:
