    - name: EvidenceGeometryTest.rotate90MapsRegionThroughDisplayTransform
    - name: EvidenceGeometryTest.zoomAndPanApplyAfterFit
    - name: EvidenceNavigationTest.tappingInsideARegionSelectsItsSpanAndAnnounces
    - name: EvidenceNavigationTest.tappingASpanHighlightsItsRegionWithinTheImageBounds (assert overlay rect within image rect via semantics test tags)
    - name: OcrDatabaseTest.migrationAddsSpanReviewsAndCascades
    - name: ViewerScreenC1Test.rejectedSpanIsStruckThroughAndLabelled
    # --- Plan 1.3.0: RED tests for docs/reviews/2026-11-24-P2-06-pr23-review.md ---
    - name: EvidenceNavigationTest.doubleTapZoomsImageToThreeTimesItsFitWidth
      asserts: "E-01: after double-click on the canvas, the image node's unclipped SemanticsNode.size is ~3x its 1x width and a region node stays within the image node's bounds."
    - name: EvidenceNavigationTest.tapAtThreeTimesSelectsTheSpanUnderTheFinger
      asserts: "E-01: hit-testing at >1x uses the drawn transform."
    - name: EvidenceNavigationTest.verticalScrollStartingOnTheImageSelectsNothing
