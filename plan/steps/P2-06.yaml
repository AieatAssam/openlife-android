rollback: "Keep geometry fix; drop zoom."

notes: >
  Plan 1.3.0 (2026-11-24): PR #23 (head 79926a6) implements R1-R7 and was
  reviewed in docs/reviews/2026-11-24-P2-06-pr23-review.md with verdict
  "merge after fixes". R8-R18 were added from that review; the step stays
  (or returns to) in_progress until they are met, then goes to review for a
