id: P2-06
title: Evidence viewer UX
phase: P2
status: todo
depends_on: [P2-01, P1-03]
estimate: L
owner: agent
closes_findings: [F-27, F-65, F-66, F-67, F-68]

summary: >
  Make evidence navigation correct and usable: draw region highlights on the
  letterboxed, orientation-corrected image rect, support pinch-zoom and pan,
  tap a span to highlight and scroll the image to it, tap a region to select
  its span, and provide correction and review interactions per span and per
  revision with clear origin labelling.

rationale: >
  The overlay currently scales regions to the 320dp box rather than the
  fitted image, so highlights are wrong on nearly every image. C1-R4/R5
  require that opening an evidence link reveals the region with context.

ethos_check:
  - "P3: extracted, corrected (USER), and stale values are visually distinct; no value is shown as established."

requirements:
  - id: P2-06-R1
    text: "MUST implement a pure function `EvidenceGeometry.regionToCanvas(region, sourceW, sourceH, orientation, canvasSize, contentScale=Fit, zoom, pan): Rect` with JVM tests covering letterboxing on both axes and all eight orientations."
  - id: P2-06-R2
    text: "MUST add a zoomable image composable (transformable state: scale 1-8x, pan clamped to content bounds) using only Compose foundation; double-tap toggles 1x/3x; the overlay uses the same transform."
  - id: P2-06-R3
    text: "MUST support span->region (tap 'Show region' or the span text row) and region->span (tap inside the image selects the smallest containing region) with the selected span announced via liveRegion; each drawn region is also a semantics node (Role.Button, contentDescription = a short preview of the span text) so screen-reader users can reach regions directly."
  - id: P2-06-R4
    text: "MUST show ungrounded spans (no region) in a separate 'Text without a location' section with an explanation; they cannot be selected as evidence."
  - id: P2-06-R5
    text: "MUST provide per-span actions: Correct (creates a USER revision, shown under the original) and Reject span (per-span review metadata in a new table `ocr_span_reviews(id, spanId, reviewState, createdAt)` added in the next schema version per plan.yaml conventions.schema_migrations, with cascade); revision-level review stays as is."
  - id: P2-06-R6
    text: "MUST render a 'Extracted by <engine> · unreviewed' provenance line and distinct styles: extracted (normal), corrected (USER badge), rejected (strikethrough with 'rejected' label), stale (greyed with explanation)."
  - id: P2-06-R7
    text: "MUST keep memory bounded: the zoomable image uses the sampled bitmap (<=4M px); zooming does not re-decode at full size in v0.2.0 (record as a limitation with a later step if needed)."
  # --- Plan 1.3.0 (2026-11-24): additional requirements from the review of
  # PR #23 (branch cursor/p2-06-evidence-viewer-1e36, head 79926a6), recorded in
  # docs/reviews/2026-11-24-P2-06-pr23-review.md (E-01..E-10). They are part of
  # this step's acceptance: P2-06 cannot move to done until R8-R18 are met.
  # The step's rollback ("keep geometry fix; drop zoom") remains an accepted
  # alternative to R8/R9; if taken, R2's zoom clauses are withdrawn in notes
  # and R10 removes the zoom claims instead of evidencing them.
  - id: P2-06-R8
    text: "E-01: MUST render the zoomed image at its zoomed size: ZoomableEvidenceImage measures the image and the region nodes with unbounded/fixed constraints (e.g. wrapContentSize(Alignment.TopStart, unbounded = true) between offset and size, or a layout {} measuring with Constraints.fixed), so at 3x with no pan the visible image, the drawn overlays and smallestSpanAt hit-testing all use the same transform. Proven by a test that zooms, not only at 1x."
  - id: P2-06-R9
    text: "E-02: MUST make the tap detector ignore drags, pinches and scrolls: use waitForUpOrCancellation(), abandon the tap when movement exceeds touch slop, when the pointer is consumed, or when a second pointer goes down; read zoom/pan through rememberUpdatedState instead of pointerInput keys so a pan does not restart the detector or reset double-tap timing; a double-tap at 3x whose first tap selects a partly off-screen region still zooms out."
  - id: P2-06-R10
    text: "E-03: MUST correct the claims to what is tested: docs/capabilities/C1.md C1-R4 must not say 'including pinch zoom and pan' unless R8/R9 tests pass; the P2-06 evidence in plan/plan.yaml must not list 'scale 1-8x, double-tap 1x/3x' without the R8/R9 test names; the acceptance claim 'highlights align ... arbitrary aspect ratios and orientations' is evidenced at 1x and at >1x zoom; the instrumented RED tests added by this revision are shown failing (assertion, not compile) before GREEN, per AGENTS.md, with the failing run recorded."
  - id: P2-06-R11
    text: "E-04: MUST add the SQLCipher upgrade path to v3: the SQLCipher migration test in OcrDatabaseTest (currently validating at v2, OcrDatabaseTest.kt:296) migrates to the current @Database version through the production SQLCipher factory and readyInvariantCallback, asserting v2 row counts survive and the READY-invariant triggers exist and fire after migration; migrationAddsSpanReviewsAndCascades runs on SQLCipher (not FrameworkSQLiteOpenHelperFactory) or gains a SQLCipher twin. Phrase assertions against the @Database version, not Vault.SCHEMA_VERSION (P1-18-R17 may delete that constant)."
  - id: P2-06-R12
    text: "E-05: MUST order span reviews by an explicit monotonic sequence instead of createdAt, rowid: add an INTEGER sequence column to ocr_span_reviews (assigned in the inserting transaction as max(sequence)+1 per span, or an INTEGER PRIMARY KEY AUTOINCREMENT id) and select the latest review by it. Schema v3 has never shipped in any release or tag, so MIGRATION_2_3 and the exported 3.json are amended in place rather than adding v4; both copies of 3.json (vault/schemas and vault/src/androidTest/assets) are regenerated and byte-identical, and the step notes state that v3 was unreleased when amended. If v3 has shipped by the time this lands, a v4 additive migration is required instead."
  - id: P2-06-R13
    text: "E-06: MUST give a rejected span a visible state change and an undo: 'Reject span' is replaced by 'Undo reject' on a rejected span (undo appends a review row restoring the previous state; rows are never updated or deleted); pressing Reject on an already-rejected span is impossible; a rejected span's region is drawn in the rejected style and cannot be selected as evidence (smallestSpanAt skips it), per ethos P3."
  - id: P2-06-R14
    text: "E-07: MUST add the missing tests: an independent oracle for all eight EXIF orientations with letterboxing on both axes (hand-computed expected rects, not a round trip through OcrCoordinateMapper); JVM tests for clampPan, panToReveal, smallestSpanAt and nextDoubleTapZoom; OcrRepository tests that rejectSpan leaves span text untouched, is refused unless the revision is READY, and is observed through the flow; a UI test that presses Reject span and Undo reject."
  - id: P2-06-R15
    text: "E-08: MUST require the BuildConfig.DEBUG guard for the EvidenceBounds log allowlist entry in SourceEgressBoundaryTest, as the recovery-log allowlist already does, proven by a recorded mutation (remove the guard -> test fails)."
  - id: P2-06-R16
    text: "E-09 (suspected, confirm first): MUST add a test of SpanRow at 360 dp and at 320x640 with fontScale 2.0 asserting the span text column keeps a usable width (>= 120 dp) and no action is clipped; if confirmed, move the per-span actions into an overflow menu or a second row."
  - id: P2-06-R17
    text: "E-10 (suspected, low): MUST validate OcrEvidenceRegion right/bottom against the source size at persistence (reject or clamp with the span marked ungrounded, never silently drawn outside the image) and add a test with an out-of-bounds region."
  - id: P2-06-R18
    text: "MUST record the outcome of E-01..E-10 (fixed / refuted / rollback taken) in docs/verification/C1.md (C1-05) and in this step's evidence."

