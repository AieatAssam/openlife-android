id: P1-10
title: Accessibility automation and TalkBack runbook
phase: P1
status: review
started: 2026-11-26
depends_on: [P0-07, P1-08, P1-20]
estimate: M
owner: agent

summary: >
  Make accessibility checks mechanical: enable Compose/Espresso accessibility
  checks in instrumented tests, add semantics tests for every screen, raise
  Lint's Accessibility category to error, and write the TalkBack manual
  runbook the owner executes on a physical device.

rationale: >
  C0-16's TalkBack leg is recorded as a gap. The sandbox cannot run
  TalkBack, but the AccessibilityChecks framework catches touch-target,
  contrast, and label issues automatically, and a runbook makes the manual
  leg repeatable.

ethos_check:
  - "Design §3: 'Preserve accessibility and test TalkBack'."

requirements:
  - id: P1-10-R1
    text: "MUST enable Compose accessibility checks (ComposeTestRule.enableAccessibilityChecks(), ATF-backed, Compose UI test 1.8+) in a shared rule used by every Compose screen test; failures are errors, with a documented suppression list (empty target). Espresso AccessibilityChecks is used only for any remaining View-based surface (none expected)."
  - id: P1-10-R2
    text: "MUST add semantics tests per screen (list, viewer, intake states, first-run, settings, about, lock, vault-unavailable) asserting: every actionable node has a label, focus order follows reading order (traversal index where needed), state changes announce via liveRegion where the existing viewer pattern is used, minimum 48dp touch targets."
  - id: P1-10-R3
    text: "MUST set lint Accessibility category to error (P0-03 left it at warning)."
  - id: P1-10-R4
    text: "MUST write docs/runbooks/talkback.md: enable TalkBack, walk each flow (share, picker, preview/save, list, viewer, delete, settings, lock), expected announcements, pass/fail table to paste into docs/verification/C0.md; owner action OA-3."
  - id: P1-10-R5
    text: "MUST verify large text 2.0x and display size 'largest' via the LargeFontLayoutTest from P0-07 extended to the new screens."

files_touched:
  - gradle/libs.versions.toml, app/build.gradle.kts
  - app/src/androidTest/java/org/openlife/app/a11y/{AccessibilityRule.kt,ScreenSemanticsTest.kt}
  - app/lint.xml
  - docs/runbooks/talkback.md

tdd:
  red:
    - name: ScreenSemanticsTest.everyScreenPassesAccessibilityChecks (parameterised over screen composables with synthetic state)
    - name: ScreenSemanticsTest.viewerEvidenceAnnouncementIsPoliteLiveRegion
  green:
    - "Fix any flagged nodes (touch targets, labels, contrast in theme)."
  refactor: []

verification:
  commands:
    - "./gradlew lint :app:connectedDebugAndroidTest"
  evidence_required:
    - "Test counts; runbook committed; owner TalkBack results when available."

acceptance_criteria:
  - "AccessibilityChecks pass on both CI legs; runbook exists; C0-16 row cites both."

docs_to_update:
  - docs/verification/C0.md (C0-16)
  - docs/THREAT_MODEL.md (accessibility sentence)

risks:
  - "Material3 default contrast in dynamic colour can fail checks; adjust theme tokens rather than suppress."
rollback: "Disable checks; keep tests."

notes: >
  Plan 1.3.0 (2026-11-24): depends on P1-20 so semantics tests target the
  rebuilt destinations. P1-19 already fixes the A-08 defects found in
  docs/reviews/2026-11-24-app-audit.md (decorative divider, span-named
  actions, outline contrast, StampBadge double announcement); this step's
  automated checks must keep them fixed rather than re-fixing them.

  2026-11-26 (agent): started on acting-owner authorisation while the
  dependencies P0-07, P1-08 and P1-20 were at `review`, not `done`.

  R1 deviation: `enableAccessibilityChecks()` lives in
  androidx.compose.ui:ui-test-accessibility (1.12.1 matches the BOM's
  ui-test; checked on Google Maven 2026-11-26), which brings
  com.google.android.apps.common.testing.accessibility.framework:accessibility-test-framework
  (latest 4.1.1). Neither is in the Gradle cache or
  verification-metadata.xml, and a new dependency needs an owner decision
  record. Proposed (owner decision, not taken): add
  `androidTestImplementation("androidx.compose.ui:ui-test-accessibility")`
  via the BOM with verification metadata, and replace
  AccessibilityRule.findIssues() with enableAccessibilityChecks(), keeping
  the suppression list. Meanwhile AccessibilityRule is an in-house
  semantics-tree rule (label, 48 dp, image description, field label, role,
  duplicate bounds, clipped text). It has 2 documented suppressions:
  evidence regions, whose equivalent is the "Show region" buttons, and the
  capped search snippets. libs.versions.toml was not touched.
  Robolectric was not added, so Compose UI tests remain instrumented only.

  R2 deviation: focus order is not asserted. Compose orders TalkBack by
  geometry and the app sets no traversalIndex, so a tree-order check would
  not show what TalkBack does. It is covered by runbook rows A2, A13 and B3.

  Device gaps (implemented; unverified (gap — pending physical-device run)):
  ./gradlew :app:connectedDebugAndroidTest
  -Pandroid.testInstrumentationRunnerArguments.class=org.openlife.app.a11y.ScreenSemanticsTest
  (both tests), then the existing classes listed in
  docs/verification/P1-10-accessibility.md, which has the prioritised
  checklist. The acceptance criterion "checks pass on both CI legs" is
  therefore not met yet. The TalkBack runbook (OA-3) is written and not yet
  executed.

  Found and not fixed (ideas, not done here):
  - The list's Delete buttons say "Delete"/"Retry deletion" without the
    item label. That is acceptable in context (WCAG 2.4.4), but naming the
    item is better. Changing it rewrites descriptions that 5 instrumented
    tests and SecureWindowUiTest (uiautomator By.desc("Delete")) look up,
    which cannot be re-run here.
  - The OCR history toggle has no expanded/collapsed state.
  - The correction, search and reset-word fields set both a label and a
    contentDescription, so they may be announced twice (runbook A22, A30).
  - A zoomed image cannot be panned by accessibility action, only revealed
    via "Show region" or reset via "Fit to screen". Idea: visible zoom
    buttons and scroll actions.
  - AOSP lint's Accessibility checks see little of Compose; the source
    rules carry most of the static weight.
  2026-11-27/28 (agent, review fixes and device run): origin/main was already
  merged (no-op). Review fixes are listed in docs/verification/P1-10-accessibility.md
  ("Review fixes (2026-11-27)"). Full app suite run on the attached tablet
  (Huawei AGS2-W09, Android 8.0, API 26): 148 tests, 8 assertion failures,
  4 assumption skips, 0 errors. Failures and the ScreenSemanticsTest findings
  (236: 233 clipped-text, 3 touch-target) are recorded in the verification
  record, not fixed here. The TalkBack runbook was corrected against
  strings.xml (26 replacements), gained a precondition (no real data on the
  device) and section D (two-pane layout and share success path); it is still
  not executed. Open: R1 deviation (ATF not adopted, decision record pending);
  acceptance line "checks pass on both CI legs" not met (CI emulator legs are
  manual-dispatch only); default focus indicator about 1.2:1 on paper; no
  accessible pan for zoomed images (WCAG 2.5.7); possible double announcement
  of labelled text fields (device check pending). Status stays review.
