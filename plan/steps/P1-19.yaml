  - app/src/main/java/org/openlife/app/MainActivity.kt
  - app/src/main/java/org/openlife/app/intake/{IntakeActivity.kt,IntakeIntentValidator.kt,PickerNonce.kt,OpenExistingIntent.kt}
  - app/src/main/java/org/openlife/app/ui/{ViewerScreen.kt,OcrPanel.kt,ViewerImage.kt,IntakeScreen.kt,IntakeViewModel.kt,OcrViewModel.kt,ContentTextField.kt}
  - app/src/main/java/org/openlife/app/ui/theme/{OpenLifeColors.kt,Type.kt,Shapes.kt}
  - app/src/main/java/org/openlife/app/ui/brand/BrandComponents.kt
  - app/src/main/java/org/openlife/app/settings/{ResetVaultFlow.kt,AppLockSettings.kt,SettingsViewModel.kt}
