tdd:
  red:
    - name: app test AppLockStateTest.externalTripLongerThanGraceLocksOnReturn
    - name: app androidTest AppLockFlowTest.droppedPickerResultDoesNotLeaveTheLockDisabled
      asserts: "A-07 confirm/refute: recreate without a result, background past timeout, foreground -> lock screen shown."
    - name: app androidTest AppLockFlowTest.deviceCredentialUnlockOnApi29KeepsThePendingShare
      asserts: "A-12 confirm/refute; runs on CI API 29 (assume-skip elsewhere with the reason in the output)."
    - name: app androidTest ContentTextFieldTest.correctionFieldOffersNoCopyOrCut
      asserts: "Long-press selection toolbar has no Copy/Cut item; clipboard unchanged (read via test-only ClipboardManager in the test process only)."
    - name: app androidTest ContentTextFieldTest.correctionFieldDisablesAutocorrectAndPersonalisedLearning
      asserts: "EditorInfo captured via the test IME hook has IME_FLAG_NO_PERSONALIZED_LEARNING (or the recorded gap)."
    - name: app test SourceEgressBoundaryTest.everyContentTextFieldUsesTheSafeWrapper
      asserts: "Mutation: a bare OutlinedTextField in ViewerScreen fails the test; revert."
    - name: app androidTest IntakeScreenFlowTest.saveThenHomeEndsReadyOrCleanlyCancelledNeverUnknown
      asserts: "Tap Save, immediately stop the activity (noHistory finishes it); after settling, the source is READY and listed, or no stage/row remains; never a READY-less claim of success."
    - name: app test ColorSchemeCompletenessTest.noRoleFallsBackToMaterialBaseline
    - name: app test TypographyBriefTest.buttonsTitlesAndHeadlinesUsePlexAndFrauncesOnlyForDisplay
    - name: app androidTest ButtonShapeTest.buttonsUseTheEightDpShape
    - name: app androidTest BrandScreenshotInstrumentedTest.deleteDialogMatchesGolden (light and dark)
    - name: app androidTest AccessibilitySemanticsTest.perforationDividerIsNotAnnounced
    - name: app androidTest AccessibilitySemanticsTest.ocrRowActionsNameTheirSpan
    - name: app test PaletteContrastTest.outlineRoleMeetsThreeToOneOnPaperAndCarbon
    - name: app androidTest AccessibilitySemanticsTest.stampBadgeLabelIsAnnouncedOnce
      asserts: "A-08 StampBadge confirm/refute."
    - name: app androidTest MultiWindowScrubTest.decodedBitmapsAreReleasedWhileHidden
      asserts: "A-06 confirm/refute: checked while the activity is still stopped, before ON_START."
    - name: app androidTest NavigationBackTest.deleteFromViewerKeepsListOnTheBackStack
      asserts: "A-10 confirm/refute with the flow-emits-first ordering forced."
    - name: app androidTest SettingsRotationTest.verifyAllAndResetStageSurviveRotation
      asserts: "A-11 confirm/refute."
    - name: app androidTest OcrPersistenceFlowTest.ocrTextIsForgottenForSourcesDeletedAfterVaultReset
      asserts: "A-13 confirm/refute."
    - name: app test OpenExistingIntentTest.openSourceExtraWithoutValidNonceIsIgnored
    - name: app test IntakeIntentValidatorTest.ownAuthorityCheckCannotBeBypassedWithUserinfoOrPort
      asserts: "A-16 confirm/refute."
    - name: app test NoHardcodedUiStringsTest.stringTemplatesInTextCallsAreFlagged
    - name: "A-15 and A-18 are comment/doc corrections: reviewer reads the diff against the review file; no test."
  green:
    - "Bounded lock exemption and stale-flag clearing; ContentTextField; Save on appScope; full colour scheme, button shape, type roles, outline token; semantics fixes; nonce on the open-source extra; localisation and test-seam moves. For each suspected finding, change production code only if its RED test confirmed it."
  refactor:
    - "Remove duplicated Button shape arguments in favour of the wrappers; drop the now-unused Rule-as-outline mapping; update stale comments (A-15, A-18)."

verification:
  commands:
    - "./gradlew detekt lint :app:test :vault:test assembleDebug"
    - "./gradlew :app:connectedDebugAndroidTest"
    - "bash scripts/ci/generate-goldens.sh (local profile) and the CI generate-goldens workflow dispatch"
    - "bash scripts/release-smoke.sh app/build/outputs/apk/release/*.apk"
    - "CI API 29 and API 36 legs (A-12 needs API 29)"
  evidence_required:
    - "Per finding: confirmed / refuted / gap with test name, device, API and commit; JVM and connected counts; golden PNG list; recorded mutations; CI run ids."

acceptance_criteria:
  - "After an external trip longer than max(timeout, 60 s) the app shows the lock; a dropped picker result cannot leave the lock disabled."
  - "No content-bearing text field offers Copy or Cut, and the boundary test fails on a new unwrapped field."
  - "Save followed by Home never leaves an unknown outcome."
  - "No Material colour role equals the baseline scheme; buttons are 8 dp; no Roboto or synthesised weights in buttons, titles or headlines; dialog golden committed."
  - "Every suspected finding has a recorded confirm/refute test result; refuted findings are labelled refuted, not fixed."

docs_to_update:
  - docs/verification/P1-19-app-audit-remediation.md (new)
  - docs/THREAT_MODEL.md (lock exemption bound, zero-timeout wording, grant flag not a control, clipboard/IME controls)
  - docs/decisions/0004-app-lock.md (external-trip bound)
  - docs/design/VISUAL_IDENTITY.md (outline token at 3:1; dialogs use Plex)
  - docs/capabilities/C0.md (C0-R32 clipboard/IME wording, C0-R33 accessibility evidence)
  - docs/verification/C0.md (C0-04, C0-15 rows)
  - docs/PRIVACY_POLICY.md if the lock wording changes

risks:
  - "Changing colour roles and type roles changes every golden; regenerate local and CI-profile goldens in this step, not later."
  - "Compose may not expose IME_FLAG_NO_PERSONALIZED_LEARNING on the pinned BOM; R5 allows a recorded gap rather than a hack."
  - "Overlaps P1-07 (in review) on lock code and P1-18 on the save path; see constraints."
rollback: "Per-requirement revert. Brand token changes revert together with their goldens."

notes: >
  Added in plan 1.3.0 (2026-11-24). Source: docs/reviews/2026-11-24-app-audit.md
  (commit 190be81). A-05, A-09 and AS-1..AS-6 belong to P1-20. The dialog
  golden is added here (R10) because it is the RED proof for A-04; P1-20
  keeps it green across the navigation rebuild.
