    - name: ReturnRepositoryTest.derivedFactCarriesInputsAndRuleVersionAndGoesStaleWithInputs
    - name: ReturnFlowTest.unresolvedInputsShowPolicyTextWithoutScheduling
  green: ["Implement."]
  refactor: []
verification: {commands: ["./gradlew :vault:test && ./gradlew :vault:connectedDebugAndroidTest :app:connectedDebugAndroidTest"], evidence_required: ["Tests"]}
acceptance_criteria: ["Design §4 worked example passes end to end with a reminder on 8 October 09:00 in the chosen zone."]
