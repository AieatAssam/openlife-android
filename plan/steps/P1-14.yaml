  - docs/THREAT_MODEL.md (key loss paragraph)
  - docs/verification/C0.md (C0-12 row)

risks:
  - "Existing tests assert `confirmedReady` counts from recovery; update them to the shallow semantics."
rollback: "Restore deep startup verification behind a flag."
