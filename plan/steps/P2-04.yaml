id: P2-04
title: OCR evaluation set and gate
phase: P2
status: todo
depends_on: [P2-03]
estimate: M
owner: agent

summary: >
  Create the versioned synthetic evaluation set the design requires (§14)
  and an instrumented evaluation harness that computes character error
  rate, abstention rate, and evidence-region correctness for each registered
  engine, with thresholds that gate the engine switch.

rationale: >
  Design §14: "Maintain a small versioned synthetic evaluation set for each
  capability… measure extraction errors, abstentions and evidence-location
  correctness." Nothing like it exists; the engine switch needs numbers.

ethos_check:
  - "No real user content: fixtures are synthetic, generated by scripts in the repo."

requirements:
  - id: P2-04-R1
    text: "MUST add eval/ocr/v1/ with 40 synthetic images generated by a committed Kotlin script (vault/src/androidTest/.../EvalFixtureGenerator or a JVM generator using java.awt in a separate `eval` Gradle module): 15 phone-screenshot-style (chat, email, appointment confirmations), 15 receipts (thermal-print look, skew 0-3 degrees, noise), 10 letters/forms; each with ground-truth JSON: lines, boxes in source pixels, script class, and an 'expected_abstain' flag for the 5 non-Latin/mixed samples."
  - id: P2-04-R2
    text: "MUST add an instrumented harness (annotated @Slow) that runs each registered engine over the set and writes eval/ocr/v1/results-<engine>-<date>.json with per-image CER, line-level IoU>=0.5 match rate, abstention correctness, duration, peak PSS; and a summary markdown committed to docs/verification/ocr-eval.md."
  - id: P2-04-R3
    text: "MUST define the gate: mean CER <= 0.08 on screenshots, <= 0.15 on receipts, <= 0.10 on letters; box IoU>=0.5 for >= 90% of lines; 100% correct abstention on non-Latin fixtures; p95 duration <= 6 s on the CI emulator; peak PSS delta <= 120 MB. An engine that fails any threshold cannot be selected as default."
  - id: P2-04-R4
    text: "MUST store thresholds in eval/ocr/v1/gate.json read by the harness so the gate cannot drift silently; any change is a reviewed diff."

files_touched:
  - eval/ocr/v1/{fixtures/,truth/,gate.json,README.md}
  - eval (new Gradle JVM module for fixture generation, not shipped)
  - vault/src/androidTest/java/org/openlife/vault/ocr/eval/OcrEvaluationTest.kt
  - docs/verification/ocr-eval.md

tdd:
  red:
    - name: eval module test FixtureGeneratorTest.generatesDeterministicImagesAndTruth (same seed -> same bytes)
    - name: "OcrEvaluationTest.metricsAreComputedAgainstTruth (unit-level metric tests with tiny hand-made cases: CER, IoU)"
    - name: OcrEvaluationTest.gateFailsWhenAnyThresholdIsMissed (fake results)
  green:
    - "Generate fixtures, implement metrics, run both engines, record results."
  refactor: []

verification:
  commands:
    - "./gradlew :eval:test :eval:generateOcrFixtures"
    - "./gradlew :vault:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.openlife.vault.ocr.eval.OcrEvaluationTest"
  evidence_required:
    - "Results JSON for both engines; summary table; gate outcome."

acceptance_criteria:
  - "Both engines have recorded results; the Tesseract engine passes the gate or the fallback decision (RapidOCR) is triggered and recorded in ADR-0003 with a new sub-step."

docs_to_update:
  - docs/verification/ocr-eval.md, docs/decisions/0003-ocr-engine.md

risks:
  - "Synthetic receipts may be easier than real ones; the receipt threshold is deliberately looser and the beta (P5-04) collects qualitative feedback without collecting images."
rollback: "Eval set remains useful regardless."
