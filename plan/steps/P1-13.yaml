    - name: app androidTest ViewerScreenTest.unreadableContentIsExplainedWithDeleteActionNotVerifying
    - name: app androidTest ViewerScreenTest.transientReadOffersRetryAndDoesNotClaimDamage (added 2026-09-23)
    - name: app androidTest SourceListScreenTest.deletingAVisibleRowDoesNotCrashWithRecycledBitmap
    - name: app androidTest SourceListScreenTest.trimmingWhileRowsAreVisibleDoesNotDrawARecycledBitmap (added 2026-09-23; reproduces F-28 directly)
