    - "./gradlew :vault:test && ./gradlew :vault:connectedDebugAndroidTest :app:connectedDebugAndroidTest"
  evidence_required:
    - "Tests; manual: scroll a 30-item list while sharing -> preview appears, no Busy."

acceptance_criteria:
  - "Sharing while thumbnails load never reports Busy; deletion still cannot overlap a plaintext read."

docs_to_update:
