id: P1-20
title: Navigation and state architecture rebuild
phase: P1
status: todo
depends_on: [P1-19, P2-06]
estimate: L
owner: agent
closes_findings: [F-60, F-64]

summary: >
  Rebuild navigation and UI state ownership before any further screen is
  added (docs/reviews/2026-11-24-app-audit.md A-05, A-09, AS-1..AS-6):
  per-destination ViewModels built from an app container, detail screens
  that load their source by id, a real list-detail destination whose
  selection lives in the route, a background scrub that clears content
  without resetting navigation, one non-exported nonce-checked entry for
  internal deep links, and tests that exercise behaviour instead of
  grepping source text. Behaviour-preserving for users except where a
  requirement states the change.

rationale: >
  The audit's verdict for navigation, MainActivity and ViewModel layout is
  "rebuild before adding any screen". OpenLifeNavHost takes 17 parameters,
  the viewer can only open a source present in the loaded list
  (SourceScreens.find), expanded width uses a self-popping Viewer redirect,
  every ViewModel is activity-scoped, and the C0-R32 scrub resets
  navigation, which would wipe event-confirmation forms (P4-03) on every app
  switch. Search hits (P2-08), evidence links (P3) and event detail (P4-07)
  all need load-by-id. It depends on P2-06 so that it restructures the
  final evidence viewer rather than one PR #23 is about to replace. Because
  P1-12 depends on this step, v0.1.0 now also waits for P2-06 to be done;
  this is accepted in plan 1.3.0 (the release train's 'contains [P0, P1]'
  is unchanged, P2-06 is simply a prerequisite).

ethos_check:
  - "No plaintext user content in saved instance state: the back stack and SavedStateHandle hold only UUIDs and non-content UI state (selected span id, zoom); a test asserts the saved bundle contains no span text or bytes."
  - "Background scrub still clears every decoded image, OCR text and preview on onStop (C0-R32); only the navigation position survives, and returning still passes the app lock."
  - "Deep links never come from extras on the exported launcher."

constraints:
  - "Behaviour-preserving: the user-visible flows covered by CoreFlowUxTest, IntakeAndListFlowTest, AppLockFlowTest, AdaptiveLayoutTest, ViewerScreenC1Test, EvidenceNavigationTest (P2-06) and release-smoke.sh keep passing with unchanged assertions, except the one intended change in R4 (returning from background reopens the same destination instead of the list), which updates C0-R32's wording and the affected assertions in the same commit."
  - "No schema change; no new runtime dependency beyond androidx.lifecycle/navigation artefacts already on the classpath (record any added artefact per the dependency policy)."
  - "Starts only after P2-06 is done; rebases onto the merged evidence viewer."

requirements:
  - id: P1-20-R1
    text: "AS-1: MUST add an AppContainer created by OpenLifeApp (repositories, MutationQueue, ImportHousekeeping, lock controller, vault access) and build every screen ViewModel with viewModel(factory = ...) inside its composable<> destination, scoped to the back-stack entry, with route arguments read from SavedStateHandle (typed routes, toRoute()). OpenLifeNavHost takes at most the NavController, the container and window size class; the 17-parameter signature and the activity-scoped OcrViewModel are removed."
  - id: P1-20-R2
    text: "AS-2 / A-05: MUST make the viewer (and the pattern for every future detail screen) load its source by id from the repository (SourceViewRepository observe-by-id flow), independent of the list's state: a viewer opened for a source that is not in the loaded list, or before the list has loaded, shows that source; a missing or deleted id shows the existing 'no longer available' state and returns to the list once. SourceScreens.find and the list-state lookup are deleted."
  - id: P1-20-R3
    text: "AS-3: MUST replace the expanded-width self-popping Viewer redirect (OpenLifeNavHost.kt:166-173) with one list-detail destination whose selected source id is part of the route; resizing between compact and expanded (multi-window, rotation, fold) keeps the selection and the back behaviour (compact: Back from detail returns to list; expanded: Back clears the selection, then leaves)."
  - id: P1-20-R4
    text: "AS-4: MUST scrub content without resetting navigation: onStop clears decoded images, OCR text, previews and any held plaintext synchronously (the holder from P1-19-R13, SensitiveContentCache, OcrPresenter.clearTransient) but keeps the back stack and route arguments (UUIDs only); on return, after the lock gate, the destination reloads its content by id. MultiWindowScrubTest and the C0-R32 evidence are updated to assert 'content cleared while hidden, destination preserved'."
  - id: P1-20-R5
    text: "AS-5 / A-14: MUST route 'Open existing' and every future internal deep link (P4-04 reminder taps) through a single non-exported entry (an exported=false activity or a PendingIntent-only target) that validates a single-use per-process nonce and a typed route before navigating; MainActivity, which stays exported as the launcher, ignores EXTRA_OPEN_SOURCE_ID and any other navigation extra. ManifestBoundaryTest keeps 'exactly MainActivity and IntakeActivity exported'."
  - id: P1-20-R6
    text: "AS-6 / A-09: MUST replace the source-grep unit tests SecureWindowTest (unit), LargeFontLayoutTest, RtlLayoutTest, NavigationBackTest (unit) and EdgeToEdgeInsetsTest with Compose UI/semantics instrumented tests that exercise the behaviour (FLAG_SECURE on every content window and dialog; no clipped control at fontScale 2.0 and 320x640; RTL layout mirrors; Back from each destination; insets applied at 48 dp bars). Each replacement is proven RED by a recorded mutation of the behaviour it guards before the grep test is deleted. Boundary greps that guard forbidden APIs (SourceEgressBoundaryTest, ManifestBoundaryTest, NoHardcodedUiStringsTest) stay."
  - id: P1-20-R7
    text: "AS-6: MUST keep the dialog golden from P1-19-R10 green and add goldens for the list-detail destination at expanded width (light/dark, profile-keyed), regenerated locally and via the CI generate-goldens dispatch."
  - id: P1-20-R8
    text: "A-09: MUST replace every Thread.sleep in app/src/androidTest and vault/src/androidTest (10 in app at commit 190be81, e.g. IntakeAndListFlowTest.kt:79, :326, :396, :557, :619, IntakeActivityTest.kt:213) with state-based awaits (composeRule.waitUntil on semantics, Flow.first { terminal }, MutationQueue idle await, UiDevice.wait(Until...)); a verification grep for Thread.sleep in androidTest returns nothing, or each remaining hit carries a comment explaining why no state exists to await."
  - id: P1-20-R9
    text: "MUST restructure the P2-06 evidence viewer onto R1/R2: ViewerViewModel (entry-scoped) owns the selected span id and zoom/pan as non-content saved state, loads OCR by source id, and the OcrPanel/ZoomableEvidenceImage composables receive state and callbacks only; P2-06's EvidenceNavigationTest and ViewerScreenC1Test pass unchanged."
  - id: P1-20-R10
    text: "MUST record the before/after architecture (container, destinations, entry, scrub semantics) in docs/design/screens.md and the C0-R32 change in docs/capabilities/C0.md, and the verification in docs/verification/P1-20-navigation-rebuild.md."

