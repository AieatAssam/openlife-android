risks:
  - "Large diff across every screen; land it in reviewable commits (container, then by-id, then list-detail, then scrub, then entry, then tests) on the one step branch."
  - "Golden and timing churn; regenerate goldens in this step and keep awaits state-based."
  - "Holds v0.1.0 behind P2-06 (see rationale)."
rollback: "Revert the step branch merge; the pre-rebuild navigation still works because no schema or persisted state changes."

notes: >
