  - app/src/main/java/org/openlife/app/{OpenLifeApp.kt,AppContainer.kt,MainActivity.kt,ImportHousekeeping.kt}
  - app/src/main/java/org/openlife/app/navigation/{OpenLifeNavHost.kt,Routes.kt,InternalLinkActivity.kt or equivalent}
  - app/src/main/java/org/openlife/app/ui/{SourceListViewModel.kt,ViewerViewModel.kt,OcrViewModel.kt,OcrPresenter.kt,ViewerScreen.kt,SourceListScreen.kt}
  - app/src/main/java/org/openlife/app/ui/evidence/* (from P2-06)
  - app/src/main/java/org/openlife/app/settings/SettingsViewModel.kt (container-provided)
  - app/src/main/java/org/openlife/app/intake/{IntakeActivity.kt,OpenExistingIntent.kt}
  - app/src/main/AndroidManifest.xml (non-exported internal entry)
  - vault/src/main/java/org/openlife/vault/repository/SourceViewRepository.kt (observe by id, if not already present)
  - app/src/test/java/org/openlife/app/ui/{SecureWindowTest.kt,LargeFontLayoutTest.kt,RtlLayoutTest.kt,NavigationBackTest.kt,EdgeToEdgeInsetsTest.kt} (deleted after replacement)
  - app/src/androidTest/java/org/openlife/app/ui/* (replacements; sleeps removed)
  - vault/src/androidTest/** (sleeps removed)
  - docs/design/screens.md, docs/capabilities/C0.md, docs/verification/P1-20-navigation-rebuild.md

tdd:
  red:
    - name: app androidTest ViewerByIdTest.viewerOpensASourceThatIsNotInTheLoadedList
    - name: app androidTest ViewerByIdTest.viewerOpenedBeforeTheListLoadsShowsTheSource
    - name: app androidTest ViewerByIdTest.deletedIdShowsUnavailableAndReturnsToListOnce
    - name: app androidTest AdaptiveLayoutTest.selectionSurvivesCompactToExpandedAndBack
    - name: app androidTest AdaptiveLayoutTest.expandedBackClearsSelectionBeforeLeaving
    - name: app androidTest MultiWindowScrubTest.backgroundingClearsContentButKeepsTheDestination
      asserts: "While stopped: no decoded bitmap, no OCR text held; after return and unlock: same destination and source id, content reloaded."
    - name: app androidTest SavedStateTest.savedBundleHoldsNoContent
      asserts: "Process-death simulation: the saved state bundle contains UUIDs and numbers only; no span text, no bytes."
    - name: app test ManifestBoundaryTest.internalLinkEntryIsNotExported
    - name: app androidTest InternalLinkTest.openExistingGoesThroughTheInternalEntryWithNonce
    - name: app androidTest InternalLinkTest.launcherIgnoresOpenSourceExtra
      asserts: "An explicit MainActivity intent with EXTRA_OPEN_SOURCE_ID opens the list, not the viewer."
    - name: app test ViewModelScopingTest.noScreenViewModelIsActivityScoped (Compose host test or reflection over the destinations, not a grep)
    - name: app androidTest SecureWindowUiTest.everyContentWindowAndDialogIsSecure (replaces the unit grep; mutation - remove FLAG_SECURE from the delete dialog)
    - name: app androidTest LargeFontUiTest.noControlIsClippedAtFontScaleTwoOn320x640 (replaces LargeFontLayoutTest)
    - name: app androidTest RtlUiTest.listAndViewerMirrorInRtl (replaces RtlLayoutTest)
    - name: app androidTest NavigationBackTest.backFromEveryDestination (replaces the unit NavigationBackTest)
    - name: app androidTest EdgeToEdgeUiTest.contentClearsSystemBarsWithLargeInsets (replaces EdgeToEdgeInsetsTest)
    - name: app androidTest BrandScreenshotInstrumentedTest.listDetailExpandedMatchesGolden
    - name: "Thread.sleep removal is verified by the grep in verification.commands, not by a RED test."
  green:
    - "AppContainer, entry-scoped ViewModels, by-id loading, list-detail route, content-only scrub, internal entry, behaviour tests, state-based awaits."
  refactor:
    - "Delete the replaced grep tests, SourceScreens.find, the redirect, and the activity-scoped ViewModel wiring; shrink MainActivity to lock gate + NavHost."

verification:
  commands:
    - "./gradlew detekt lint :app:test :vault:test assembleDebug"
    - "./gradlew :vault:connectedDebugAndroidTest :app:connectedDebugAndroidTest"
    - "grep -rn 'Thread.sleep' app/src/androidTest vault/src/androidTest (expect no hits, or each hit justified in a comment)"
    - "./gradlew assembleRelease && bash scripts/release-smoke.sh app/build/outputs/apk/release/*.apk"
    - "CI API 29 and API 36 legs"
  evidence_required:
    - "Commits per TDD phase; JVM and connected counts before and after (the test count may drop by the deleted grep tests; list each deletion with its replacement); recorded mutations for every replacement; grep output; release smoke result; CI run ids; wall-clock duration of the app connected suite before and after the sleep removal."

acceptance_criteria:
  - "OpenLifeNavHost has no per-screen lambdas; every screen ViewModel is entry-scoped and built from the container."
  - "Any detail screen opens by id regardless of list state; expanded width uses one list-detail destination with the selection in the route."
  - "Backgrounding clears content but preserves the destination; no content in saved state."
  - "No navigation extra is honoured on the exported launcher; internal links pass a nonce through a non-exported entry."
  - "No source-grep test stands in for a behaviour test; no unexplained Thread.sleep remains in instrumented tests."
  - "All pre-existing user-flow tests and release smoke pass unchanged except the documented R4 change."

docs_to_update:
  - docs/design/screens.md
  - docs/capabilities/C0.md (C0-R32 scrub semantics)
  - docs/verification/C0.md (C0-04, C0-15)
