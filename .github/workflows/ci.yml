name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-lint-unit-test:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: ./.github/actions/gradle-setup

      - name: Validate plan
        run: scripts/plan-check.sh

      - name: Static analysis, lint, JVM tests, and debug build
        run: ./gradlew detekt lint :app:test :vault:test assembleDebug

      - name: Upload static-analysis, lint, and JVM reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jvm-and-static-reports
          retention-days: 30
          if-no-files-found: warn
          path: |
            app/build/reports/detekt/**
            vault/build/reports/detekt/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            vault/build/reports/lint-results-*.html
            vault/build/reports/lint-results-*.xml
            app/build/reports/tests/**
            vault/build/reports/tests/**

  instrumented-tests:
    name: Instrumented tests (API ${{ matrix.api-level }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: ./.github/actions/gradle-setup

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # GHA ubuntu images already ship ANDROID_HOME/cmdline-tools. The older
      # emulator-runner pin used `sudo mkdir` and died with "File exists"
      # plus spawn adb ENOENT (run 35439433360). Keep KVM on the udev step
      # above — do not pass enable-kvm; that input is not in every pin.
      - name: Prepare Android SDK cmdline-tools and adb
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          {
            echo "ANDROID_HOME=${sdk_root}"
            echo "ANDROID_SDK_ROOT=${sdk_root}"
            echo "ANDROID_USER_HOME=${HOME}/.android"
            echo "ANDROID_EMULATOR_HOME=${HOME}/.android"
            echo "ANDROID_AVD_HOME=${HOME}/.android/avd"
          } >> "${GITHUB_ENV}"
          mkdir -p "${HOME}/.android/avd"

          cmdline_latest="${sdk_root}/cmdline-tools/latest"
          if [ -d "${sdk_root}/cmdline-tools" ] && [ ! -e "${cmdline_latest}" ]; then
            newest="$(find "${sdk_root}/cmdline-tools" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1 || true)"
            if [ -n "${newest}" ]; then
              ln -sfn "$(basename "${newest}")" "${cmdline_latest}"
            fi
          fi

          if [ -d "${sdk_root}/platform-tools" ]; then
            echo "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          fi
          if [ -d "${cmdline_latest}/bin" ]; then
            echo "${cmdline_latest}/bin" >> "${GITHUB_PATH}"
          fi

      - name: Run connected tests with one retry for infrastructure flakes
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -o pipefail
            trap 'adb logcat -d 2>/dev/null | grep -E "org\\.openlife|OpenLifeRecovery" > "logcat-openlife-${{ matrix.api-level }}.txt" || true' EXIT
            for attempt in 1 2; do
              output="connected-attempt-${{ matrix.api-level }}-${attempt}.log"
              set +e
              ./gradlew :app:connectedDebugAndroidTest :vault:connectedDebugAndroidTest 2>&1 | tee "$output"
              status=${PIPESTATUS[0]}
              set -e
              if [[ "$status" -eq 0 ]]; then
                exit 0
              fi
              if scripts/ci/connected-test-failure-is-assertion.sh "$output"; then
                echo "connected test assertion failure; not retrying" >&2
                exit "$status"
              fi
              if [[ "$attempt" -eq 2 ]]; then
                exit "$status"
              fi
              timeout 60s adb wait-for-device || true
            done

      - name: Capture filtered OpenLife logcat
        if: always()
        run: |
          adb logcat -d 2>/dev/null | grep -E 'org\.openlife|OpenLifeRecovery' > "logcat-openlife-${{ matrix.api-level }}.txt" || true

      - name: Upload instrumented results and logcat
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instrumented-results-api-${{ matrix.api-level }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            app/build/outputs/androidTest-results/**
            vault/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            vault/build/reports/androidTests/**
            connected-attempt-${{ matrix.api-level }}-*.log
            logcat-openlife-${{ matrix.api-level }}.txt

  release-inspection:
    name: Release APK boundary inspection
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: ./.github/actions/gradle-setup

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - name: Inspect release APK boundary and size
        run: |
          scripts/inspect-release-apk.sh app/build/outputs/apk/release/app-release.apk | tee release-inspection.txt
          apk_size_bytes="$(awk -F= '$1 == "APK_SIZE_BYTES" { print $2; exit }' release-inspection.txt)"
          {
            echo "## Release APK"
            echo
            echo "- Boundary inspection: pass"
            echo "- APK size: ${apk_size_bytes} bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release inspection report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-apk-inspection
          retention-days: 30
          if-no-files-found: warn
          path: |
            release-inspection.txt
            app/build/outputs/apk/release/app-release.apk
