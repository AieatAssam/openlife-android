name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Debug APK: quickest way to sideload for manual testing
      # (adb install), signed with the ephemeral CI debug keystore.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Release APK/AAB: minified/shrunk per the release build type,
      # currently also debug-signed (see app/build.gradle.kts) so it's
      # installable for internal testing without a real keystore secret.
      # Not store-distribution signing - see
      # docs/decisions/0001-c0-defaults.md's pending pre-distribution
      # decisions before using this for a real release.
      - name: Build release APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
