name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and inspect without creating a GitHub Release
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  workflow-lint:
    name: Lint release workflow
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          files: .github/workflows/release.yml
          version: 1.7.7

  build-release:
    name: Build signed release APK and AAB
    needs: workflow-lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: ./.github/actions/gradle-setup

      - name: Validate release version and changelog
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${RELEASE_TAG#v}"
          test "${RELEASE_TAG}" = "v${tag_version}"
          test "${version}" = "${tag_version}"
          grep -Fq "## [${tag_version}]" CHANGELOG.md

      - name: Determine signing mode
        id: signing
        env:
          OPENLIFE_KEYSTORE_B64: ${{ secrets.OPENLIFE_KEYSTORE_B64 }}
          OPENLIFE_KEYSTORE_PASSWORD: ${{ secrets.OPENLIFE_KEYSTORE_PASSWORD }}
          OPENLIFE_KEY_ALIAS: ${{ secrets.OPENLIFE_KEY_ALIAS }}
          OPENLIFE_KEY_PASSWORD: ${{ secrets.OPENLIFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in OPENLIFE_KEYSTORE_B64 OPENLIFE_KEYSTORE_PASSWORD OPENLIFE_KEY_ALIAS OPENLIFE_KEY_PASSWORD; do
            secret_value="${!secret_name}"
            if [[ -n "${secret_value}" ]]; then
              echo "::add-mask::${secret_value}"
            fi
          done
          present=0
          for secret_name in OPENLIFE_KEYSTORE_B64 OPENLIFE_KEYSTORE_PASSWORD OPENLIFE_KEY_ALIAS OPENLIFE_KEY_PASSWORD; do
            [[ -n "${!secret_name}" ]] && present=$((present + 1))
          done
          if [[ "${present}" -ne 0 && "${present}" -ne 4 ]]; then
            echo "Release signing secrets must be provided together" >&2
            exit 1
          fi
          if [[ "${present}" -eq 4 ]]; then
            echo "signed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "signed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build release APK and AAB
        env:
          OPENLIFE_KEYSTORE_B64: ${{ secrets.OPENLIFE_KEYSTORE_B64 }}
          OPENLIFE_KEYSTORE_PASSWORD: ${{ secrets.OPENLIFE_KEYSTORE_PASSWORD }}
          OPENLIFE_KEY_ALIAS: ${{ secrets.OPENLIFE_KEY_ALIAS }}
          OPENLIFE_KEY_PASSWORD: ${{ secrets.OPENLIFE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify release signing and create certificate fingerprint
        id: certificate
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -perm -111 | sort | tail -n 1)"
          test -n "${apksigner}"
          "${apksigner}" verify --verbose --print-certs "${apk}" | tee certificate-details.txt
          fingerprint="$(sed -n -E 's/^(Signer #[0-9]+|V[0-9.]+ Signer): certificate SHA-256 digest: //p' certificate-details.txt | head -n 1)"
          test -n "${fingerprint}"
          mkdir -p release-artifacts
          printf '%s\n' "${fingerprint}" > release-artifacts/CERTIFICATE-FINGERPRINT-SHA256.txt

      - name: Mark unsigned build
        if: steps.signing.outputs.signed == 'false'
        run: |
          set -euo pipefail
          {
            echo "## Release signing"
            echo
            echo "unsigned (no secrets) — no release artifact will be published"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Package signed release evidence
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp app/build/reports/bom/bom.json release-artifacts/SBOM.json
          cp docs/generated/THIRD_PARTY_LICENSES.md release-artifacts/THIRD_PARTY_LICENSES.md
          sha256sum \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            release-artifacts/SBOM.json \
            release-artifacts/THIRD_PARTY_LICENSES.md \
            release-artifacts/CERTIFICATE-FINGERPRINT-SHA256.txt \
            > release-artifacts/SHA-256SUMS

      - name: Upload signed release evidence
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openlife-release-evidence
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            release-artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.signed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            release-artifacts/*
