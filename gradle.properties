org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.0 made Kotlin compilation built-in by default, which drops the
# org.jetbrains.kotlin.android plugin and the kotlinOptions{} DSL in favour of
# an android.kotlin{} block. This project opts out and keeps the
# org.jetbrains.kotlin.android plugin explicitly, because that surface is
# stable, is what Room/SQLCipher/Compose documentation assumes, and this repo
# would otherwise be tracking a brand-new DSL through its own churn. AGP
# documents this flag as removed in AGP 10 (mid-2026); revisit it as a
# recorded decision before upgrading past AGP 9.x. See
# docs/decisions/0001-c0-defaults.md.
android.builtInKotlin=false
# AGP 9.0's new `android.newDsl=true` default extension type is also
# incompatible with the classic org.jetbrains.kotlin.android plugin; both
# flags are needed together to keep the pre-AGP-9 plugin working. Same
# rationale and revisit condition as android.builtInKotlin above.
android.newDsl=false
